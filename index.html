<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Zebra T51 Schulung</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  color: #222;
}

header {
  background: #111827;
  color: white;
  padding: 18px 16px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 24px;
}

header p {
  margin: 5px 0 0;
  font-size: 15px;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 14px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.step {
  font-size: 14px;
  font-weight: bold;
  color: #2563eb;
  margin-bottom: 8px;
  text-transform: uppercase;
}

label {
  display: block;
  font-weight: bold;
  font-size: 19px;
  margin-bottom: 8px;
}

input {
  width: 100%;
  padding: 16px;
  font-size: 20px;
  border: 2px solid #d1d5db;
  border-radius: 10px;
}

input:focus {
  outline: none;
  border-color: #2563eb;
}

.small {
  color: #666;
  font-size: 14px;
}

#signatureCanvas {
  display: block;
  width: 100%;
  height: 220px;
  border: 2px solid #9ca3af;
  border-radius: 10px;
  background: white;
  touch-action: none;
}

button {
  width: 100%;
  padding: 16px;
  font-size: 18px;
  font-weight: bold;
  border: 0;
  border-radius: 10px;
  margin-top: 10px;
}

.success {
  background: #16a34a;
  color: white;
}

.secondary {
  background: #e5e7eb;
  color: #111827;
}

.danger {
  background: #dc2626;
  color: white;
}

.status {
  padding: 13px;
  border-radius: 9px;
  margin-top: 12px;
  font-weight: bold;
  display: none;
}

.status.ok {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.record {
  border-top: 1px solid #ddd;
  padding: 15px 0;
}

.record:first-child {
  border-top: 0;
}

.record strong {
  display: inline-block;
  min-width: 95px;
}

.record img {
  max-width: 100%;
  height: 90px;
  border: 1px solid #ddd;
  border-radius: 5px;
  margin-top: 5px;
}
</style>
</head>

<body>

<header>
  <h1>📱 Zebra T51 Schulung</h1>
  <p>Name · Barcode · Unterschrift</p>
</header>

<div class="container">

  <div class="card">
    <div class="step">Schritt 1</div>
    <label for="name">Name des Kunden</label>
    <input
      id="name"
      type="text"
      placeholder="Name eingeben"
      autocomplete="name">
  </div>

  <div class="card">
    <div class="step">Schritt 2</div>
    <label for="scan">Barcode / QR-Code</label>

    <input
      id="scan"
      type="text"
      placeholder="Barcode scannen..."
      autocomplete="off"
      inputmode="none">

    <p class="small">
      Scan-Taste am Zebra T51 drücken.
      Der Barcode wird automatisch übernommen.
    </p>
  </div>

  <div class="card">
    <div class="step">Schritt 3</div>
    <label>Unterschrift des Kunden</label>

    <canvas id="signatureCanvas"></canvas>

    <button class="secondary" onclick="clearSignature()">
      Unterschrift löschen
    </button>
  </div>

  <div class="card">

    <button class="success" onclick="saveRecord()">
      💾 Vorgang speichern
    </button>

    <button class="secondary" onclick="newRecord()">
      ➕ Neuer Vorgang
    </button>

    <div id="status" class="status"></div>

  </div>

  <div class="card">

    <h2>📋 Gespeicherte Vorgänge</h2>

    <div id="records"></div>

    <button class="danger" onclick="deleteAllRecords()">
      Alle Vorgänge löschen
    </button>

  </div>

</div>

<script>

const scanInput = document.getElementById("scan");
const nameInput = document.getElementById("name");
const canvas = document.getElementById("signatureCanvas");
const ctx = canvas.getContext("2d");

let drawing = false;
let hasSignature = false;

function resizeCanvas() {

  const ratio = window.devicePixelRatio || 1;

  canvas.width = canvas.clientWidth * ratio;
  canvas.height = canvas.clientHeight * ratio;

  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);

function getPosition(e) {

  const r = canvas.getBoundingClientRect();

  return {
    x: e.clientX - r.left,
    y: e.clientY - r.top
  };
}

canvas.addEventListener("pointerdown", function(e) {

  drawing = true;
  hasSignature = true;

  const p = getPosition(e);

  ctx.beginPath();
  ctx.moveTo(p.x, p.y);

  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener("pointermove", function(e) {

  if (!drawing) return;

  const p = getPosition(e);

  ctx.lineTo(p.x, p.y);
  ctx.stroke();
});

canvas.addEventListener("pointerup", function() {
  drawing = false;
});

canvas.addEventListener("pointercancel", function() {
  drawing = false;
});

function clearSignature() {

  ctx.clearRect(
    0,
    0,
    canvas.clientWidth,
    canvas.clientHeight
  );

  hasSignature = false;
}

function showStatus(message, ok) {

  const status = document.getElementById("status");

  status.textContent = message;

  status.className = "status";

  if (ok) {
    status.classList.add("ok");
  }
}

function saveRecord() {

  const name = nameInput.value.trim();
  const barcode = scanInput.value.trim();

  if (!name) {

    showStatus(
      "Bitte zuerst den Namen eingeben.",
      false
    );

    nameInput.focus();
    return;
  }

  if (!barcode) {

    showStatus(
      "Bitte zuerst den Barcode scannen.",
      false
    );

    scanInput.focus();
    return;
  }

  if (!hasSignature) {

    showStatus(
      "Bitte den Kunden unterschreiben lassen.",
      false
    );

    return;
  }

  const record = {

    id: Date.now(),

    name: name,

    barcode: barcode,

    date: new Date().toLocaleString("de-DE"),

    signature: canvas.toDataURL("image/png")
  };

  const records =
    JSON.parse(
      localStorage.getItem("zebraRecords") || "[]"
    );

  records.unshift(record);

  localStorage.setItem(
    "zebraRecords",
    JSON.stringify(records)
  );

  showStatus(
    "✓ Vorgang wurde gespeichert.",
    true
  );

  loadRecords();
}

function newRecord() {

  nameInput.value = "";
  scanInput.value = "";

  clearSignature();

  showStatus("", false);

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

  nameInput.focus();
}

function loadRecords() {

  const records =
    JSON.parse(
      localStorage.getItem("zebraRecords") || "[]"
    );

  const container =
    document.getElementById("records");

  container.innerHTML = "";

  if (!records.length) {

    container.innerHTML =
      "<p class='small'>Noch keine Vorgänge gespeichert.</p>";

    return;
  }

  records.forEach(function(record) {

    const div = document.createElement("div");

    div.className = "record";

    div.innerHTML =

      "<div><strong>Name:</strong> " +
      escapeHtml(record.name) +
      "</div>" +

      "<div><strong>Barcode:</strong> " +
      escapeHtml(record.barcode) +
      "</div>" +

      "<div><strong>Datum:</strong> " +
      escapeHtml(record.date) +
      "</div>" +

      "<div style='margin-top:8
