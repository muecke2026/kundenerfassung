<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zebra T51 Schulung</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f4f7;
    color: #222;
}

header {
    background: #111827;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 24px;
}

header p {
    margin: 6px 0 0;
    opacity: 0.8;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 16px;
    font-size: 20px;
    border: 2px solid #d1d5db;
    border-radius: 10px;
    margin-bottom: 15px;
}

input:focus {
    outline: none;
    border-color: #2563eb;
}

button {
    width: 100%;
    padding: 16px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    margin-top: 10px;
    cursor: pointer;
}

.primary {
    background: #2563eb;
    color: white;
}

.success {
    background: #16a34a;
    color: white;
}

.danger {
    background: #dc2626;
    color: white;
}

.secondary {
    background: #e5e7eb;
    color: #111827;
}

#signatureCanvas {
    width: 100%;
    height: 220px;
    border: 2px solid #9ca3af;
    border-radius: 10px;
    background: white;
    touch-action: none;
}

.status {
    padding: 12px;
    border-radius: 8px;
    margin-top: 12px;
    display: none;
    font-weight: bold;
}

.status.ok {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.record {
    border-top: 1px solid #ddd;
    padding: 15px 0;
}

.record:first-child {
    border-top: none;
}

.record strong {
    display: inline-block;
    min-width: 130px;
}

.small {
    color: #666;
    font-size: 14px;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<header>
    <h1>📱 Zebra T51 Schulung</h1>
    <p>Scannen · Erfassen · Unterschreiben · Speichern</p>
</header>

<div class="container">

    <div class="card">

        <label for="scan">Barcode / QR-Code</label>

        <input
            id="scan"
            type="text"
            placeholder="Barcode scannen..."
            autocomplete="off"
            autofocus
        >

        <p class="small">
            Scanner am Zebra T51 betätigen. Der Scan wird automatisch übernommen.
        </p>

        <label for="name">Name Teilnehmer</label>

        <input
            id="name"
            type="text"
            placeholder="Name eingeben"
        >

        <label for="training">Schulung / Thema</label>

        <input
            id="training"
            type="text"
            placeholder="z. B. Geräteschulung"
        >

    </div>


    <div class="card">

        <label>Unterschrift</label>

        <canvas id="signatureCanvas"></canvas>

        <button
            class="secondary"
            onclick="clearSignature()">
            Unterschrift löschen
        </button>

    </div>


    <div class="card">

        <button
            class="success"
            onclick="saveRecord()">
            💾 Vorgang speichern
        </button>

        <button
            class="secondary"
            onclick="newRecord()">
            ➕ Neuer Vorgang
        </button>

        <div id="status" class="status"></div>

    </div>


    <div class="card">

        <h2>📋 Gespeicherte Vorgänge</h2>

        <div id="records"></div>

        <button
            class="danger"
            onclick="deleteAllRecords()">
            Alle Vorgänge löschen
        </button>

    </div>

</div>


<script>

const scanInput = document.getElementById("scan");
const nameInput = document.getElementById("name");
const trainingInput = document.getElementById("training");

const canvas = document.getElementById("signatureCanvas");
const ctx = canvas.getContext("2d");

let drawing = false;
let hasSignature = false;


/* -----------------------------
   CANVAS
----------------------------- */

function resizeCanvas() {

    const ratio = window.devicePixelRatio || 1;

    canvas.width = canvas.clientWidth * ratio;
    canvas.height = canvas.clientHeight * ratio;

    ctx.scale(ratio, ratio);

    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);


function getPosition(event) {

    const rect = canvas.getBoundingClientRect();

    return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
    };
}


canvas.addEventListener("pointerdown", function(event) {

    drawing = true;
    hasSignature = true;

    const pos = getPosition(event);

    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
});


canvas.addEventListener("pointermove", function(event) {

    if (!drawing) return;

    const pos = getPosition(event);

    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
});


canvas.addEventListener("pointerup", function() {

    drawing = false;
});


canvas.addEventListener("pointerleave", function() {

    drawing = false;
});


function clearSignature() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    hasSignature = false;
}


/* -----------------------------
   SPEICHERN
----------------------------- */

function saveRecord() {

    const barcode = scanInput.value.trim();
    const name = nameInput.value.trim();
    const training = trainingInput.value.trim();

    if (!barcode) {
        showStatus("Bitte zuerst einen Barcode scannen.", false);
        scanInput.focus();
        return;
    }

    if (!name) {
        showStatus("Bitte den Namen eingeben.", false);
        nameInput.focus();
        return;
    }

    if (!hasSignature) {
        showStatus("Bitte unterschreiben.", false);
        return;
    }

    const record = {

        id: Date.now(),

        barcode: barcode,

        name: name,

        training: training,

        date: new Date().toLocaleString("de-DE"),

        signature: canvas.toDataURL("image/png")
    };


    const records =
        JSON.parse(
            localStorage.getItem("zebraRecords") || "[]"
        );


    records.unshift(record);


    localStorage.setItem(
        "zebraRecords",
        JSON.stringify(records)
    );


    showStatus(
        "✓ Vorgang wurde gespeichert.",
        true
    );


    loadRecords();
}


/* -----------------------------
   NEUER VORGANG
----------------------------- */

function newRecord() {

    scanInput.value = "";
    nameInput.value = "";
    trainingInput.value = "";

    clearSignature();

    scanInput.focus();

    showStatus("", false);
}


/* -----------------------------
   ANZEIGE
----------------------------- */

function loadRecords() {

    const records =
        JSON.parse(
            localStorage.getItem("zebraRecords") || "[]"
        );

    const container =
        document.getElementById("records");

    container.innerHTML = "";


    if (records.length === 0) {

        container.innerHTML =
            '<p class="small">Noch keine Vorgänge gespeichert.</p>';

        return;
    }


    records.forEach(function(record) {

        const div =
            document.createElement("div");

        div.className = "record";


        div.innerHTML = `

            <div>
                <strong>Barcode:</strong>
                ${escapeHtml(record.barcode)}
            </div>

            <div>
                <strong>Name:</strong>
                ${escapeHtml(record.name)}
            </div>

            <div>
                <strong>Schulung:</strong>
                ${escapeHtml(record.training || "-")}
            </div>

            <div>
                <strong>Datum:</strong>
                ${escapeHtml(record.date)}
            </div>

            <div style="margin-top:10px;">
                <strong>Unterschrift:</strong><br>
                <img
                    src="${record.signature}"
                    style="max-width:100%;height:100px;border:1px solid #ddd;border-radius:5px;margin-top:5px;"
                >
            </div>

        `;

        container.appendChild(div);
    });
}


/* -----------------------------
   ALLE LÖSCHEN
----------------------------- */

function deleteAllRecords() {

    if (!confirm("Wirklich alle gespeicherten Vorgänge löschen?")) {
        return;
    }

    localStorage.removeItem("zebraRecords");

    loadRecords();

    showStatus(
        "Alle Vorgänge wurden gelöscht.",
        true
    );
}


/* -----------------------------
   STATUS
----------------------------- */

function showStatus(message, success) {

    const status =
        document.getElementById("status");

    status.textContent = message;

    status.className =
        "status " + (success ? "ok" : "");
}


/* -----------------------------
   SICHERHEIT
----------------------------- */

function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* -----------------------------
   START
----------------------------- */

loadRecords();

</script>

</body>
</html>
