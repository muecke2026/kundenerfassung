<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kundenerfassung</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  color: #222;
}

header {
  background: #111827;
  color: white;
  text-align: center;
  padding: 24px 16px;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin: 8px 0 0;
  font-size: 17px;
}

.container {
  max-width: 800px;
  margin: 20px auto;
  padding: 0 16px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.step {
  color: #2563eb;
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 12px;
}

label {
  display: block;
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 12px;
}

input[type="text"] {
  width: 100%;
  padding: 18px;
  border: 2px solid #d1d5db;
  border-radius: 14px;
  font-size: 22px;
  background: white;
}

input[type="text"]:focus {
  outline: none;
  border-color: #2563eb;
}

.help {
  margin-top: 12px;
  color: #666;
  font-size: 17px;
  line-height: 1.4;
}

.signature-box {
  width: 100%;
  height: 280px;
  border: 3px solid #9ca3af;
  border-radius: 14px;
  background: white;
  touch-action: none;
}

button {
  width: 100%;
  padding: 18px;
  border: none;
  border-radius: 14px;
  font-size: 21px;
  font-weight: bold;
  margin-top: 12px;
  cursor: pointer;
}

.save-button {
  background: #16a34a;
  color: white;
}

.clear-button {
  background: #6b7280;
  color: white;
}

.delete-button {
  background: #dc2626;
  color: white;
}

.record {
  border-top: 1px solid #ddd;
  padding: 20px 0;
}

.record:first-child {
  border-top: none;
}

.record div {
  font-size: 18px;
  margin: 7px 0;
}

.record strong {
  display: inline-block;
  min-width: 100px;
}

.signature-image {
  max-width: 100%;
  width: 300px;
  border: 1px solid #ddd;
  border-radius: 8px;
  margin-top: 8px;
}

.success {
  background: #dcfce7;
  color: #166534;
  padding: 15px;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 15px;
  display: none;
}

.empty {
  color: #777;
  font-size: 17px;
}
</style>
</head>

<body>

<header>
  <h1>📱 Kundenerfassung</h1>
  <p>Name · Barcode · Unterschrift</p>
</header>

<div class="container">

  <div id="successMessage" class="success">
    ✓ Vorgang wurde gespeichert.
  </div>

  <!-- SCHRITT 1 -->
  <div class="card">
    <div class="step">SCHRITT 1</div>

    <label for="customerName">
      Name des Kunden
    </label>

    <input
      type="text"
      id="customerName"
      placeholder="Name eingeben"
      autocomplete="off"
    >
  </div>


  <!-- SCHRITT 2 -->
  <div class="card">
    <div class="step">SCHRITT 2</div>

    <label for="barcode">
      Barcode / QR-Code
    </label>

    <input
      type="text"
      id="barcode"
      placeholder="Barcode scannen..."
      autocomplete="off"
    >

    <div class="help">
      Scan-Taste am Zebra T51 drücken.
      Der Barcode wird automatisch übernommen.
    </div>
  </div>


  <!-- SCHRITT 3 -->
  <div class="card">
    <div class="step">SCHRITT 3</div>

    <label>
      Unterschrift des Kunden
    </label>

    <canvas
      id="signatureCanvas"
      class="signature-box">
    </canvas>

    <button
      type="button"
      class="clear-button"
      onclick="clearSignature()">
      Unterschrift löschen
    </button>
  </div>


  <!-- SPEICHERN -->
  <div class="card">

    <button
      type="button"
      class="save-button"
      onclick="saveRecord()">
      ✓ Vorgang speichern
    </button>

  </div>


  <!-- GESPEICHERTE VORGÄNGE -->
  <div class="card">

    <div class="step">
      📋 Gespeicherte Vorgänge
    </div>

    <div id="records">
      <div class="empty">
        Noch keine Vorgänge gespeichert.
      </div>
    </div>

    <button
      type="button"
      class="delete-button"
      onclick="deleteAllRecords()">
      Alle Vorgänge löschen
    </button>

  </div>

</div>


<script>

let canvas = document.getElementById("signatureCanvas");
let ctx = canvas.getContext("2d");

let drawing = false;


/* =========================================================
   SIGNATUR
   ========================================================= */

function resizeCanvas() {

  let rect = canvas.getBoundingClientRect();

  let oldImage = null;

  if (canvas.width > 0 && canvas.height > 0) {
    try {
      oldImage = canvas.toDataURL();
    } catch(e) {}
  }

  canvas.width = rect.width;
  canvas.height = rect.height;

  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "#000";

  if (oldImage) {
    let image = new Image();

    image.onload = function() {
      ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
    };

    image.src = oldImage;
  }
}

resizeCanvas();


function getPosition(e) {

  let rect = canvas.getBoundingClientRect();

  let x;
  let y;

  if (e.touches && e.touches.length > 0) {

    x = e.touches[0].clientX - rect.left;
    y = e.touches[0].clientY - rect.top;

  } else {

    x = e.clientX - rect.left;
    y = e.clientY - rect.top;
  }

  return {
    x: x,
    y: y
  };
}


function startDrawing(e) {

  e.preventDefault();

  drawing = true;

  let pos = getPosition(e);

  ctx.beginPath();
  ctx.moveTo(pos.x, pos.y);
}


function draw(e) {

  if (!drawing) return;

  e.preventDefault();

  let pos = getPosition(e);

  ctx.lineTo(pos.x, pos.y);
  ctx.stroke();
}


function stopDrawing(e) {

  if (e) e.preventDefault();

  drawing = false;
  ctx.closePath();
}


canvas.addEventListener("mousedown", startDrawing);
canvas.addEventListener("mousemove", draw);
canvas.addEventListener("mouseup", stopDrawing);
canvas.addEventListener("mouseleave", stopDrawing);

canvas.addEventListener("touchstart", startDrawing, {
  passive: false
});

canvas.addEventListener("touchmove", draw, {
  passive: false
});

canvas.addEventListener("touchend", stopDrawing, {
  passive: false
});


function clearSignature() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );
}


/* =========================================================
   BARCODE
   ========================================================= */

/*
   Der Zebra T51 ist so eingestellt, dass der Scanner
   den Barcode als Tastatureingabe liefert.

   Deshalb muss das Barcode-Feld fokussiert sein.
*/

document.getElementById("barcode").addEventListener(
  "focus",
  function() {
    this.select();
  }
);


/* =========================================================
   VORGANG SPEICHERN
   ========================================================= */

function saveRecord() {

  let name =
    document.getElementById("customerName").value.trim();

  let barcode =
    document.getElementById("barcode").value.trim();

  if (name === "") {

    alert("Bitte zuerst den Namen des Kunden eingeben.");

    document
      .getElementById("customerName")
      .focus();

    return;
  }


  if (barcode === "") {

    alert("Bitte zuerst den Barcode scannen.");

    document
      .getElementById("barcode")
      .focus();

    return;
  }


  let signature =
    canvas.toDataURL("image/png");


  let record = {

    name: name,

    barcode: barcode,

    date: new Date().toLocaleString(
      "de-DE"
    ),

    signature: signature
  };


  let records =
    JSON.parse(
      localStorage.getItem("zebraRecords") || "[]"
    );


  records.unshift(record);


  localStorage.setItem(
    "zebraRecords",
    JSON.stringify(records)
  );


  loadRecords();


  document
    .getElementById("customerName")
    .value = "";

  document
    .getElementById("barcode")
    .value = "";

  clearSignature();


  let success =
    document.getElementById("successMessage");

  success.style.display = "block";


  setTimeout(function() {

    success.style.display = "none";

  }, 3000);


  document
    .getElementById("customerName")
    .focus();
}


/* =========================================================
   GESPEICHERTE VORGÄNGE LADEN
   ========================================================= */

function loadRecords() {

  let records =
    JSON.parse(
      localStorage.getItem("zebraRecords") || "[]"
    );


  let container =
    document.getElementById("records");


  if (records.length === 0) {

    container.innerHTML =
      '<div class="empty">' +
      'Noch keine Vorgänge gespeichert.' +
      '</div>';

    return;
  }


  container.innerHTML = "";


  records.forEach(function(record) {

    let div =
      document.createElement("div");

    div.className = "record";


    div.innerHTML =

      "<div><strong>Name:</strong> " +
      escapeHtml(record.name) +
      "</div>" +

      "<div><strong>Barcode:</strong> " +
      escapeHtml(record.barcode) +
      "</div>" +

      "<div><strong>Datum:</strong> " +
      escapeHtml(record.date) +
      "</div>" +

      "<div><strong>Unterschrift:</strong></div>" +

      '<img class="signature-image" src="' +
      record.signature +
      '" alt="Unterschrift">';


    container.appendChild(div);

  });
}


/* =========================================================
   HTML SICHER DARSTELLEN
   ========================================================= */

function escapeHtml(text) {

  let div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


/* =========================================================
   ALLE VORGÄNGE LÖSCHEN
   ========================================================= */

function deleteAllRecords() {

  let records =
    JSON.parse(
      localStorage.getItem("zebraRecords") || "[]"
    );


  if (records.length === 0) {

    alert("Es sind keine Vorgänge gespeichert.");

    return;
  }


  if (
    confirm(
      "Wirklich alle Vorgänge löschen?"
    )
  ) {

    localStorage.removeItem(
      "zebraRecords"
    );

    loadRecords();

  }
}


/* =========================================================
   START
   ========================================================= */

loadRecords();

</script>

</body>
</html>
