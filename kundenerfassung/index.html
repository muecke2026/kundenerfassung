<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Kundenerfassung</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  color: #222;
}

header {
  background: #111827;
  color: white;
  text-align: center;
  padding: 22px 14px;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin: 7px 0 0;
  font-size: 17px;
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 14px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.step {
  color: #2563eb;
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 10px;
}

label {
  display: block;
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 10px;
}

input {
  width: 100%;
  padding: 17px;
  border: 2px solid #cbd5e1;
  border-radius: 12px;
  font-size: 21px;
  background: white;
}

input:focus {
  outline: none;
  border-color: #2563eb;
}

.help {
  margin-top: 10px;
  color: #666;
  font-size: 16px;
  line-height: 1.4;
}

/* UNTERSCHRIFT */
#signatureCanvas {
  width: 100%;
  height: 260px;
  display: block;
  background: white;
  border: 3px solid #9ca3af;
  border-radius: 12px;

  /*
    Ganz wichtig:
    Das Feld ist kein Eingabefeld.
    Es darf niemals Fokus bekommen.
  */
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  outline: none;
}

button {
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 17px;
  margin-top: 11px;
  font-size: 20px;
  font-weight: bold;
}

.save {
  background: #16a34a;
  color: white;
}

.clear {
  background: #6b7280;
  color: white;
}

.delete {
  background: #dc2626;
  color: white;
}

.success {
  display: none;
  background: #dcfce7;
  color: #166534;
  padding: 15px;
  border-radius: 12px;
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 15px;
}

.record {
  border-top: 1px solid #ddd;
  padding: 17px 0;
}

.record:first-child {
  border-top: none;
}

.record div {
  font-size: 17px;
  margin: 6px 0;
}

.signature-image {
  width: 300px;
  max-width: 100%;
  border: 1px solid #ddd;
  border-radius: 8px;
}

.empty {
  color: #777;
  font-size: 16px;
}
</style>
</head>

<body>

<header>
  <h1>📱 Kundenerfassung</h1>
  <p>Name · Barcode · Unterschrift</p>
</header>

<div class="container">

  <div id="success" class="success">
    ✓ Vorgang wurde gespeichert.
  </div>


  <!-- NAME -->

  <div class="card">

    <div class="step">
      SCHRITT 1
    </div>

    <label for="customerName">
      Name des Kunden
    </label>

    <input
      id="customerName"
      type="text"
      placeholder="Name eingeben"
      autocomplete="off">

  </div>


  <!-- BARCODE -->

  <div class="card">

    <div class="step">
      SCHRITT 2
    </div>

    <label for="barcode">
      Barcode
    </label>

    <input
      id="barcode"
      type="text"
      placeholder="Barcode scannen..."
      autocomplete="off">

    <div class="help">
      Scan-Taste am Zebra T51 drücken.
      Nach dem Scan wird die Tastatur geschlossen.
    </div>

  </div>


  <!-- UNTERSCHRIFT -->

  <div class="card">

    <div class="step">
      SCHRITT 3
    </div>

    <label>
      Unterschrift des Kunden
    </label>

    <canvas
      id="signatureCanvas"
      tabindex="-1">
    </canvas>

    <button
      class="clear"
      type="button"
      onclick="clearSignature()">

      Unterschrift löschen

    </button>

  </div>


  <!-- SPEICHERN -->

  <div class="card">

    <button
      class="save"
      type="button"
      onclick="saveRecord()">

      ✓ Vorgang speichern

    </button>

  </div>


  <!-- GESPEICHERTE VORGÄNGE -->

  <div class="card">

    <div class="step">
      📋 Gespeicherte Vorgänge
    </div>

    <div id="records">

      <div class="empty">
        Noch keine Vorgänge gespeichert.
      </div>

    </div>

    <button
      class="delete"
      type="button"
      onclick="deleteAllRecords()">

      Alle Vorgänge löschen

    </button>

  </div>

</div>


<script>

/* =========================================================
   ELEMENTE
   ========================================================= */

const nameInput =
  document.getElementById("customerName");

const barcodeInput =
  document.getElementById("barcode");

const canvas =
  document.getElementById("signatureCanvas");

const ctx =
  canvas.getContext("2d");

let drawing = false;
let hasSignature = false;


/* =========================================================
   TASTATUR SCHLIESSEN
   ========================================================= */

function closeKeyboard() {

  nameInput.blur();

  barcodeInput.blur();

}


/* =========================================================
   BARCODE-SCAN
   ========================================================= */

barcodeInput.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      event.preventDefault();

      closeKeyboard();

    }

  }
);


/* =========================================================
   CANVAS DARF NIEMALS FOKUS BEKOMMEN
   ========================================================= */

canvas.addEventListener(
  "focus",
  function() {

    canvas.blur();

  }
);


/* =========================================================
   CANVAS GRÖSSE
   ========================================================= */

function setupCanvas() {

  const rect =
    canvas.getBoundingClientRect();

  canvas.width =
    rect.width;

  canvas.height =
    rect.height;

  ctx.lineWidth = 3;

  ctx.lineCap =
    "round";

  ctx.lineJoin =
    "round";

  ctx.strokeStyle =
    "#000";

}

setupCanvas();


/* =========================================================
   POSITION ERMITTELN
   ========================================================= */

function getPosition(event) {

  const rect =
    canvas.getBoundingClientRect();

  let clientX;
  let clientY;


  if (
    event.touches &&
    event.touches.length > 0
  ) {

    clientX =
      event.touches[0].clientX;

    clientY =
      event.touches[0].clientY;

  } else {

    clientX =
      event.clientX;

    clientY =
      event.clientY;

  }


  return {

    x:
      clientX -
      rect.left,

    y:
      clientY -
      rect.top

  };

}


/* =========================================================
   UNTERSCHRIFT START
   ========================================================= */

function startDrawing(event) {

  event.preventDefault();

  /*
    Tastatur sicher schließen.
  */

  closeKeyboard();

  drawing = true;

  hasSignature = true;

  const position =
    getPosition(event);

  ctx.beginPath();

  ctx.moveTo(
    position.x,
    position.y
  );

}


/* =========================================================
   UNTERSCHRIFT ZEICHNEN
   ========================================================= */

function draw(event) {

  if (!drawing) {

    return;

  }

  event.preventDefault();

  const position =
    getPosition(event);

  ctx.lineTo(
    position.x,
    position.y
  );

  ctx.stroke();

}


/* =========================================================
   UNTERSCHRIFT ENDE
   ========================================================= */

function stopDrawing(event) {

  if (event) {

    event.preventDefault();

  }

  drawing = false;

  ctx.closePath();

}


/* =========================================================
   TOUCH
   ========================================================= */

canvas.addEventListener(
  "touchstart",
  startDrawing,
  {
    passive: false
  }
);

canvas.addEventListener(
  "touchmove",
  draw,
  {
    passive: false
  }
);

canvas.addEventListener(
  "touchend",
  stopDrawing,
  {
    passive: false
  }
);


/* =========================================================
   MAUS / FALLBACK
   ========================================================= */

canvas.addEventListener(
  "mousedown",
  startDrawing
);

canvas.addEventListener(
  "mousemove",
  draw
);

canvas.addEventListener(
  "mouseup",
  stopDrawing
);

canvas.addEventListener(
  "mouseleave",
  stopDrawing
);


/* =========================================================
   UNTERSCHRIFT LÖSCHEN
   ========================================================= */

function clearSignature() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  hasSignature = false;

}


/* =========================================================
   SPEICHERN
   ========================================================= */

function saveRecord() {

  const name =
    nameInput.value.trim();

  const barcode =
    barcodeInput.value.trim();


  if (!name) {

    alert(
      "Bitte zuerst den Namen des Kunden eingeben."
    );

    nameInput.focus();

    return;

  }


  if (!barcode) {

    alert(
      "Bitte zuerst den Barcode scannen."
    );

    barcodeInput.focus();

    return;

  }


  if (!hasSignature) {

    alert(
      "Bitte den Kunden unterschreiben lassen."
    );

    return;

  }


  const record = {

    name:
      name,

    barcode:
      barcode,

    date:
      new Date().toLocaleString(
        "de-DE"
      ),

    signature:
      canvas.toDataURL(
        "image/png"
      )

  };


  let records =
    JSON.parse(
      localStorage.getItem(
        "zebraRecords"
      ) || "[]"
    );


  records.unshift(
    record
  );


  localStorage.setItem(
    "zebraRecords",
    JSON.stringify(records)
  );


  loadRecords();


  nameInput.value = "";

  barcodeInput.value = "";

  clearSignature();

  closeKeyboard();


  const message =
    document.getElementById(
      "success"
    );

  message.style.display =
    "block";


  setTimeout(
    function() {

      message.style.display =
        "none";

    },
    3000
  );

}


/* =========================================================
   GESPEICHERTE VORGÄNGE
   ========================================================= */

function loadRecords() {

  const records =
    JSON.parse(
      localStorage.getItem(
        "zebraRecords"
      ) || "[]"
    );


  const container =
    document.getElementById(
      "records"
    );


  if (
    records.length === 0
  ) {

    container.innerHTML =
      '<div class="empty">' +
      'Noch keine Vorgänge gespeichert.' +
      '</div>';

    return;

  }


  container.innerHTML =
    "";


  records.forEach(
    function(record) {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "record";


      div.innerHTML =

        "<div><strong>Name:</strong> " +
        escapeHtml(
          record.name
        ) +
        "</div>" +

        "<div><strong>Barcode:</strong> " +
        escapeHtml(
          record.barcode
        ) +
        "</div>" +

        "<div><strong>Datum:</strong> " +
        escapeHtml(
          record.date
        ) +
        "</div>" +

        "<div><strong>Unterschrift:</strong></div>" +

        '<img class="signature-image" src="' +
        record.signature +
        '" alt="Unterschrift">';


      container.appendChild(
        div
      );

    }
  );

}


/* =========================================================
   SICHERER TEXT
   ========================================================= */

function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text;

  return div.innerHTML;

}


/* =========================================================
   ALLE VORGÄNGE LÖSCHEN
   ========================================================= */

function deleteAllRecords() {

  const records =
    JSON.parse(
      localStorage.getItem(
        "zebraRecords"
      ) || "[]"
    );


  if (
    records.length === 0
  ) {

    alert(
      "Es sind keine Vorgänge gespeichert."
    );

    return;

  }


  if (
    confirm(
      "Wirklich alle Vorgänge löschen?"
    )
  ) {

    localStorage.removeItem(
      "zebraRecords"
    );

    loadRecords();

  }

}


/* =========================================================
   START
   ========================================================= */

loadRecords();

</script>

</body>
</html>
