<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Kundenerfassung</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  color: #222;
}

header {
  background: #111827;
  color: white;
  text-align: center;
  padding: 22px 14px;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin: 7px 0 0;
  font-size: 17px;
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 14px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.step {
  color: #2563eb;
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 12px;
}

label.title {
  display: block;
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 10px;
}

.choice {
  display: flex;
  align-items: center;
  gap: 12px;
  border: 2px solid #d1d5db;
  border-radius: 12px;
  padding: 16px;
  margin: 10px 0;
  font-size: 20px;
}

.choice input {
  width: 24px;
  height: 24px;
  margin: 0;
}

input[type="text"] {
  width: 100%;
  padding: 17px;
  border: 2px solid #cbd5e1;
  border-radius: 12px;
  font-size: 21px;
  background: white;
}

input[type="text"]:focus {
  outline: none;
  border-color: #2563eb;
}

.hidden {
  display: none;
}

.help {
  margin-top: 10px;
  color: #666;
  font-size: 16px;
  line-height: 1.4;
}

/* Unterschrift */

#signatureCanvas {
  display: block;
  width: 100%;
  height: 280px;
  background: white;
  border: 3px solid #9ca3af;
  border-radius: 12px;

  touch-action: none;

  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;

  outline: none;
}

/* Buttons */

button {
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 17px;
  margin-top: 11px;
  font-size: 20px;
  font-weight: bold;
}

.save {
  background: #16a34a;
  color: white;
}

.pdf {
  background: #2563eb;
  color: white;
}

.clear {
  background: #6b7280;
  color: white;
}

.delete {
  background: #dc2626;
  color: white;
}

/* Erfolg */

.success {
  display: none;
  background: #dcfce7;
  color: #166534;
  padding: 15px;
  border-radius: 12px;
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 15px;
}

/* gespeicherte Vorgänge */

.record {
  border-top: 1px solid #ddd;
  padding: 17px 0;
}

.record:first-child {
  border-top: none;
}

.record div {
  font-size: 17px;
  margin: 6px 0;
}

.signature-image {
  width: 300px;
  max-width: 100%;
  border: 1px solid #ddd;
  border-radius: 8px;
}

.empty {
  color: #777;
  font-size: 16px;
}
</style>
</head>

<body>

<header>

  <h1>📱 Kundenerfassung</h1>

  <p>
    Empfang · Barcode · Unterschrift
  </p>

</header>


<div class="container">


  <!-- Erfolg -->

  <div
    id="success"
    class="success">

    ✓ Vorgang wurde gespeichert.

  </div>


  <!-- ======================================
       SCHRITT 1
       ====================================== -->

  <div class="card">

    <div class="step">
      SCHRITT 1
    </div>

    <label class="title">
      Wer hat die Sendung erhalten?
    </label>


    <label class="choice">

      <input
        type="radio"
        name="receiverType"
        value="Empfänger"
        checked>

      <span>
        Der Empfänger
      </span>

    </label>


    <label class="choice">

      <input
        type="radio"
        name="receiverType"
        value="Andere anwesende Person">

      <span>
        Eine andere anwesende Person
      </span>

    </label>


    <!-- Nur bei anderer Person -->

    <div
      id="otherPersonBox"
      class="hidden">

      <label
        class="title"
        for="otherPersonName">

        Name der anwesenden Person

      </label>

      <input
        id="otherPersonName"
        type="text"
        placeholder="Name eingeben"
        autocomplete="off">

    </div>

  </div>


  <!-- ======================================
       SCHRITT 2
       ====================================== -->

  <div class="card">

    <div class="step">
      SCHRITT 2
    </div>

    <label
      class="title"
      for="barcode">

      Barcode

    </label>

    <input
      id="barcode"
      type="text"
      placeholder="Barcode scannen..."
      autocomplete="off">

    <div class="help">

      Scan-Taste am Zebra T51 drücken.

      Nach dem Scan wird die Tastatur
      automatisch geschlossen.

    </div>

  </div>


  <!-- ======================================
       SCHRITT 3
       ====================================== -->

  <div class="card">

    <div class="step">
      SCHRITT 3
    </div>

    <label class="title">

      Unterschrift

    </label>


    <canvas
      id="signatureCanvas">
    </canvas>


    <button
      class="clear"
      type="button"
      onclick="clearSignature()">

      Unterschrift löschen

    </button>

  </div>


  <!-- ======================================
       SPEICHERN / PDF
       ====================================== -->

  <div class="card">

    <button
      class="save"
      type="button"
      onclick="saveRecord()">

      ✓ Vorgang speichern

    </button>


    <button
      class="pdf"
      type="button"
      onclick="createPDF()">

      📄 PDF erstellen

    </button>

  </div>


  <!-- ======================================
       GESPEICHERTE VORGÄNGE
       ====================================== -->

  <div class="card">

    <div class="step">

      📋 Gespeicherte Vorgänge

    </div>


    <div id="records">

      <div class="empty">

        Noch keine Vorgänge gespeichert.

      </div>

    </div>


    <button
      class="delete"
      type="button"
      onclick="deleteAllRecords()">

      Alle Vorgänge löschen

    </button>

  </div>


</div>


<script>


/* ======================================================
   ELEMENTE
   ====================================================== */

const otherPersonBox =
  document.getElementById(
    "otherPersonBox"
  );


const otherPersonName =
  document.getElementById(
    "otherPersonName"
  );


const barcode =
  document.getElementById(
    "barcode"
  );


const canvas =
  document.getElementById(
    "signatureCanvas"
  );


const ctx =
  canvas.getContext(
    "2d"
  );


let drawing = false;

let hasSignature = false;


/* ======================================================
   EMPFÄNGER AUSWAHL
   ====================================================== */

document
  .querySelectorAll(
    'input[name="receiverType"]'
  )
  .forEach(

    function(radio) {

      radio.addEventListener(
        "change",
        function() {

          if (
            this.value ===
            "Andere anwesende Person"
            &&
            this.checked
          ) {

            otherPersonBox
              .classList
              .remove("hidden");

          } else {

            otherPersonBox
              .classList
              .add("hidden");

            otherPersonName.value =
              "";

          }

        }
      );

    }

  );


/* ======================================================
   TASTATUR SCHLIESSEN
   ====================================================== */

function closeKeyboard() {

  if (
    document.activeElement
  ) {

    document
      .activeElement
      .blur();

  }

  otherPersonName.blur();

  barcode.blur();

}


/* ======================================================
   BARCODE
   ====================================================== */

barcode.addEventListener(

  "keydown",

  function(event) {

    if (
      event.key === "Enter"
      ||
      event.keyCode === 13
    ) {

      event.preventDefault();

      closeKeyboard();

    }

  }

);


/* ======================================================
   CANVAS PIXELGENAU
   ====================================================== */

function setupCanvas() {

  const rect =
    canvas.getBoundingClientRect();


  const ratio =
    window.devicePixelRatio || 1;


  canvas.width =
    Math.round(
      rect.width * ratio
    );


  canvas.height =
    Math.round(
      rect.height * ratio
    );


  ctx.setTransform(

    ratio,
    0,
    0,
    ratio,
    0,
    0

  );


  ctx.lineWidth =
    3;

  ctx.lineCap =
    "round";

  ctx.lineJoin =
    "round";

  ctx.strokeStyle =
    "#000";

}


setupCanvas();


/* ======================================================
   TOUCH POSITION
   ====================================================== */

function getPosition(event) {

  const rect =
    canvas.getBoundingClientRect();


  const touch =
    event.touches &&
    event.touches.length
      ? event.touches[0]
      : event;


  return {

    x:
      touch.clientX -
      rect.left,

    y:
      touch.clientY -
      rect.top

  };

}


/* ======================================================
   UNTERSCHRIFT START
   ====================================================== */

function startDrawing(event) {

  event.preventDefault();

  closeKeyboard();

  drawing =
    true;

  hasSignature =
    true;


  const position =
    getPosition(
      event
    );


  ctx.beginPath();


  ctx.moveTo(

    position.x,
    position.y

  );

}


/* ======================================================
   UNTERSCHRIFT ZEICHNEN
   ====================================================== */

function draw(event) {

  if (!drawing) {

    return;

  }


  event.preventDefault();


  const position =
    getPosition(
      event
    );


  ctx.lineTo(

    position.x,
    position.y

  );


  ctx.stroke();

}


/* ======================================================
   UNTERSCHRIFT ENDE
   ====================================================== */

function stopDrawing(event) {

  if (event) {

    event.preventDefault();

  }


  drawing =
    false;


  ctx.closePath();

}


/* ======================================================
   TOUCH EVENTS
   ====================================================== */

canvas.addEventListener(

  "touchstart",
  startDrawing,
  {
    passive: false
  }

);


canvas.addEventListener(

  "touchmove",
  draw,
  {
    passive: false
  }

);


canvas.addEventListener(

  "touchend",
  stopDrawing,
  {
    passive: false
  }

);


canvas.addEventListener(

  "touchcancel",
  stopDrawing,
  {
    passive: false
  }

);


/* ======================================================
   MAUS FALLBACK
   ====================================================== */

canvas.addEventListener(
  "mousedown",
  startDrawing
);

canvas.addEventListener(
  "mousemove",
  draw
);

canvas.addEventListener(
  "mouseup",
  stopDrawing
);

canvas.addEventListener(
  "mouseleave",
  stopDrawing
);


/* ======================================================
   UNTERSCHRIFT LÖSCHEN
   ====================================================== */

function clearSignature() {

  const rect =
    canvas.getBoundingClientRect();


  ctx.clearRect(

    0,
    0,
    rect.width,
    rect.height

  );


  hasSignature =
    false;

}


/* ======================================================
   EMPFÄNGER DATEN
   ====================================================== */

function getReceiverData() {

  const selected =
    document.querySelector(
      'input[name="receiverType"]:checked'
    );


  const type =
    selected.value;


  let name =
    "";


  if (
    type ===
    "Andere anwesende Person"
  ) {

    name =
      otherPersonName
        .value
        .trim();

  }


  return {

    type:
      type,

    name:
      name

  };

}


/* ======================================================
   SPEICHERN
   ====================================================== */

function saveRecord() {

  const receiver =
    getReceiverData();


  const code =
    barcode.value.trim();


  if (
    receiver.type ===
    "Andere anwesende Person"
    &&
    !receiver.name
  ) {

    alert(
      "Bitte den Namen der anwesenden Person eingeben."
    );

    otherPersonName.focus();

    return;

  }


  if (!code) {

    alert(
      "Bitte zuerst den Barcode scannen."
    );

    barcode.focus();

    return;

  }


  if (!hasSignature) {

    alert(
      "Bitte den Empfang unterschreiben lassen."
    );

    return;

  }


  const record = {

    receiverType:
      receiver.type,

    receiverName:
      receiver.name,

    barcode:
      code,

    date:
      new Date().toLocaleString(
        "de-DE"
      ),

    signature:
      canvas.toDataURL(
        "image/png"
      )

  };


  const records =

    JSON.parse(

      localStorage.getItem(
        "zebraRecords"
      )

      ||
      "[]"

    );


  records.unshift(
    record
  );


  localStorage.setItem(

    "zebraRecords",

    JSON.stringify(
      records
    )

  );


  loadRecords();


  /* Formular zurücksetzen */

  otherPersonName.value =
    "";

  barcode.value =
    "";


  clearSignature();


  closeKeyboard();


  document
    .querySelector(
      'input[name="receiverType"][value="Empfänger"]'
    )
    .checked =
    true;


  otherPersonBox
    .classList
    .add("hidden");


  const success =
    document.getElementById(
      "success"
    );


  success.style.display =
    "block";


  setTimeout(

    function() {

      success.style.display =
        "none";

    },

    3000

  );

}


/* ======================================================
   HTML SICHER DARSTELLEN
   ====================================================== */

function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text;


  return div.innerHTML;

}


/* ======================================================
   VORGÄNGE LADEN
   ====================================================== */

function loadRecords() {

  const records =

    JSON.parse(

      localStorage.getItem(
        "zebraRecords"
      )

      ||
      "[]"

    );


  const container =
    document.getElementById(
      "records"
    );


  if (
    records.length === 0
  ) {

    container.innerHTML =

      '<div class="empty">' +

      'Noch keine Vorgänge gespeichert.' +

      '</div>';

    return;

  }


  container.innerHTML =
    "";


  records.forEach(

    function(record) {


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "record";


      let html =

        "<div><strong>Empfangen von:</strong> " +

        escapeHtml(
          record.receiverType
        ) +

        "</div>";


      if (
        record.receiverName
      ) {

        html +=

          "<div><strong>Name:</strong> " +

          escapeHtml(
            record.receiverName
          ) +

          "</div>";

      }


      html +=

        "<div><strong>Barcode:</strong> " +

        escapeHtml(
          record.barcode
        ) +

        "</div>";


      html +=

        "<div><strong>Datum:</strong> " +

        escapeHtml(
          record.date
        ) +

        "</div>";


      html +=

        "<div><strong>Unterschrift:</strong></div>" +

        '<img class="signature-image" src="' +

        record.signature +

        '" alt="Unterschrift">';


      div.innerHTML =
        html;


      container.appendChild(
        div
      );

    }

  );

}


/* ======================================================
   PDF ERSTELLEN
   ====================================================== */

function createPDF() {

  const receiver =
    getReceiverData();


  const code =
    barcode.value.trim();


  if (
    receiver.type ===
    "Andere anwesende Person"
    &&
    !receiver.name
  ) {

    alert(
      "Bitte den Namen der anwesenden Person eingeben."
    );

    return;

  }


  if (!code) {

    alert(
      "Bitte zuerst den Barcode scannen."
    );

    return;

  }


  if (!hasSignature) {

    alert(
      "Bitte zuerst unterschreiben."
    );

    return;

  }


  const signature =
    canvas.toDataURL(
      "image/png"
    );


  const date =
    new Date().toLocaleString(
      "de-DE"
    );


  /*
    Neues Fenster für die PDF-Druckansicht.
  */

  const pdfWindow =
    window.open(
      "",
      "_blank"
    );


  if (!pdfWindow) {

    alert(
      "Das PDF-Fenster wurde blockiert. Bitte Pop-ups für diese Seite erlauben."
    );

    return;

  }


  const personLine =

    receiver.name

      ?

      `
      <tr>
        <td>Name</td>
        <td>${escapeHtml(receiver.name)}</td>
      </tr>
      `

      :

      "";


  pdfWindow.document.write(`

<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<title>Kundenerfassung</title>

<style>

body {

  font-family: Arial, sans-serif;

  margin: 40px;

  color: #222;

}

h1 {

  font-size: 28px;

  margin-bottom: 30px;

}

table {

  width: 100%;

  border-collapse: collapse;

}

td {

  padding: 12px;

  border-bottom: 1px solid #ddd;

}

td:first-child {

  font-weight: bold;

  width: 220px;

}

h2 {

  margin-top: 35px;

}

.signature {

  width: 450px;

  max-width: 100%;

  border: 1px solid #999;

  margin-top: 10px;

}

.info {

  margin-top: 30px;

  color: #666;

  font-size: 14px;

}

@media print {

  .info {

    display: none;

  }

}

</style>

</head>

<body>

<h1>Kundenerfassung</h1>

<table>

<tr>

<td>Empfangen von</td>

<td>${escapeHtml(receiver.type)}</td>

</tr>

${personLine}

<tr>

<td>Barcode</td>

<td>${escapeHtml(code)}</td>

</tr>

<tr>

<td>Datum / Uhrzeit</td>

<td>${escapeHtml(date)}</td>

</tr>

</table>

<h2>Unterschrift</h2>

<img
  class="signature"
  src="${signature}"
  alt="Unterschrift">

<div class="info">

Im Druckdialog bitte
„Als PDF speichern“ auswählen.

</div>

<script>

window.onload = function() {

  setTimeout(

    function() {

      window.print();

    },

    400

  );

};

<\/script>

</body>

</html>

`);


  pdfWindow.document.close();

}


/* ======================================================
   ALLE VORGÄNGE LÖSCHEN
   ====================================================== */

function deleteAllRecords() {

  const records =

    JSON.parse(

      localStorage.getItem(
        "zebraRecords"
      )

      ||
      "[]"

    );


  if (
    records.length === 0
  ) {

    alert(
      "Es sind keine Vorgänge gespeichert."
    );

    return;

  }


  if (

    confirm(
      "Wirklich alle Vorgänge löschen?"
    )

  ) {

    localStorage.removeItem(
      "zebraRecords"
    );


    loadRecords();

  }

}


/* ======================================================
   START
   ====================================================== */

loadRecords();

</script>

</body>
</html>
