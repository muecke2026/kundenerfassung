<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Kundenerfassung</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    font-family: Arial, sans-serif;

    background: #f2f4f7;
    color: #222;

}

body {

    padding-bottom: 30px;

}


header {

    background: #111827;
    color: white;

    text-align: center;

    padding: 20px 14px;

}


header h1 {

    margin: 0;

    font-size: 27px;

}


header p {

    margin: 7px 0 0;

    font-size: 16px;

}


.container {

    width: 100%;

    max-width: 850px;

    margin: auto;

    padding: 14px;

}


.card {

    background: white;

    border-radius: 15px;

    padding: 18px;

    margin-bottom: 15px;

    box-shadow:
    0 3px 12px rgba(0,0,0,.08);

}


.step {

    color: #2563eb;

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 12px;

}


label {

    display: block;

    font-size: 20px;

    font-weight: bold;

    margin-bottom: 9px;

}


.choice {

    display: flex;

    align-items: center;

    gap: 12px;

    border: 2px solid #d1d5db;

    border-radius: 12px;

    padding: 15px;

    margin: 10px 0;

    font-size: 19px;

}


.choice input {

    width: 24px;
    height: 24px;

    margin: 0;

}


input[type="text"] {

    width: 100%;

    padding: 16px;

    border: 2px solid #cbd5e1;

    border-radius: 12px;

    font-size: 20px;

    background: white;

}


input[type="text"]:focus {

    outline: none;

    border-color: #2563eb;

}


.hidden {

    display: none;

}


.help {

    margin-top: 9px;

    color: #666;

    font-size: 15px;

    line-height: 1.4;

}


/* =====================================
   PAKETE
   ===================================== */

.package-list {

    margin-top: 15px;

}


.package-item {

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 12px;

    margin-bottom: 8px;

    background: #f8fafc;

    border: 1px solid #d1d5db;

    border-radius: 10px;

}


.package-number {

    font-weight: bold;

    min-width: 28px;

}


.package-code {

    flex: 1;

    font-size: 17px;

    word-break: break-all;

}


.remove-package {

    width: auto;

    margin: 0;

    padding: 9px 12px;

    background: #dc2626;

    color: white;

    font-size: 15px;

}


.add-package {

    background: #0f766e;

    color: white;

}


/* =====================================
   UNTERSCHRIFT
   ===================================== */

#signatureCanvas {

    display: block;

    width: 100%;

    height: 280px;

    background: white;

    border: 3px solid #64748b;

    border-radius: 12px;

    touch-action: none;

    user-select: none;

    -webkit-user-select: none;

    -webkit-touch-callout: none;

}


/* =====================================
   BUTTONS
   ===================================== */

button {

    width: 100%;

    border: none;

    border-radius: 12px;

    padding: 16px;

    margin-top: 10px;

    font-size: 19px;

    font-weight: bold;

}


.save {

    background: #16a34a;

    color: white;

}


.pdf {

    background: #2563eb;

    color: white;

}


.email {

    background: #7c3aed;

    color: white;

}


.clear {

    background: #6b7280;

    color: white;

}


.delete {

    background: #dc2626;

    color: white;

}


.success {

    display: none;

    background: #dcfce7;

    color: #166534;

    padding: 14px;

    border-radius: 12px;

    font-weight: bold;

    font-size: 18px;

    margin-bottom: 15px;

}


.record {

    border-top: 1px solid #ddd;

    padding: 16px 0;

}


.record:first-child {

    border-top: none;

}


.record div {

    font-size: 17px;

    margin: 6px 0;

}


.signature-image {

    width: 300px;

    max-width: 100%;

    border: 1px solid #ddd;

    border-radius: 8px;

}


.empty {

    color: #777;

    font-size: 16px;

}

</style>

</head>


<body>


<header>

<h1>📱 Kundenerfassung</h1>

<p>
Empfang · Pakete · Unterschrift
</p>

</header>


<div class="container">


<div
id="success"
class="success">

✓ Vorgang wurde gespeichert.

</div>


<!-- =====================================
     EMPFÄNGER
     ===================================== -->

<div class="card">

<div class="step">
SCHRITT 1
</div>


<label>
Wer hat die Sendung erhalten?
</label>


<label class="choice">

<input
type="radio"
name="receiverType"
value="Empfänger"
checked>

<span>
Der Empfänger
</span>

</label>


<label class="choice">

<input
type="radio"
name="receiverType"
value="Andere anwesende Person">

<span>
Eine andere anwesende Person
</span>

</label>


<div
id="otherPersonBox"
class="hidden">


<label
for="otherPersonName">

Name der anwesenden Person

</label>


<input
id="otherPersonName"
type="text"
placeholder="Name eingeben"
autocomplete="off">


</div>

</div>


<!-- =====================================
     PAKETE
     ===================================== -->

<div class="card">

<div class="step">
SCHRITT 2
</div>


<label
for="barcode">

Paket scannen

</label>


<input
id="barcode"
type="text"
placeholder="Barcode scannen..."
autocomplete="off">


<div class="help">

Barcode des ersten Pakets scannen.
Danach können weitere Pakete hinzugefügt werden.

</div>


<div
id="packageList"
class="package-list">

</div>


<button
class="add-package"
type="button"
onclick="addPackage()">

➕ Weiteres Paket scannen

</button>


</div>


<!-- =====================================
     UNTERSCHRIFT
     ===================================== -->

<div class="card">

<div class="step">
SCHRITT 3
</div>


<label>
Unterschrift
</label>


<canvas
id="signatureCanvas">
</canvas>


<button
class="clear"
type="button"
onclick="clearSignature()">

Unterschrift löschen

</button>

</div>


<!-- =====================================
     AKTIONEN
     ===================================== -->

<div class="card">


<button
class="save"
type="button"
onclick="saveRecord()">

✓ Empfang speichern

</button>


<button
class="pdf"
type="button"
onclick="createPDF()">

📄 PDF erstellen

</button>


<button
class="email"
type="button"
onclick="sendPDFByEmail()">

📧 PDF per E-Mail senden

</button>


</div>


<!-- =====================================
     GESPEICHERTE VORGÄNGE
     ===================================== -->

<div class="card">

<div class="step">

📋 Gespeicherte Vorgänge

</div>


<div id="records">

<div class="empty">

Noch keine Vorgänge gespeichert.

</div>

</div>


<button
class="delete"
type="button"
onclick="deleteAllRecords()">

Alle Vorgänge löschen

</button>

</div>


</div>


<script>


/* =====================================================
   ELEMENTE
   ===================================================== */

const canvas =
document.getElementById(
    "signatureCanvas"
);


const ctx =
canvas.getContext(
    "2d"
);


let drawing = false;


let hasSignature = false;


/* =====================================================
   PAKETE
   ===================================================== */

let packages = [];


const barcode =
document.getElementById(
    "barcode"
);


const packageList =
document.getElementById(
    "packageList"
);


/* =====================================================
   CANVAS
   ===================================================== */

function setupCanvas() {

    const rect =
        canvas.getBoundingClientRect();


    canvas.width =
        Math.round(rect.width);


    canvas.height =
        Math.round(rect.height);


    ctx.setTransform(
        1,
        0,
        0,
        1,
        0,
        0
    );


    ctx.lineWidth = 3;


    ctx.lineCap = "round";


    ctx.lineJoin = "round";


    ctx.strokeStyle = "#000";

}


window.addEventListener(
    "load",
    function() {

        setTimeout(
            setupCanvas,
            200
        );

    }
);


/* =====================================================
   ORIENTIERUNG
   ===================================================== */

let resizeTimer = null;


function orientationChanged() {

    clearTimeout(
        resizeTimer
    );


    resizeTimer =
        setTimeout(
            function() {

                if (!hasSignature) {

                    setupCanvas();

                }

            },
            300
        );

}


window.addEventListener(
    "resize",
    orientationChanged
);


window.addEventListener(
    "orientationchange",
    orientationChanged
);


/* =====================================================
   TOUCH POSITION
   ===================================================== */

function getPosition(event) {

    const rect =
        canvas.getBoundingClientRect();


    const scaleX =
        canvas.width /
        rect.width;


    const scaleY =
        canvas.height /
        rect.height;


    return {

        x:
            (event.clientX -
             rect.left) *
            scaleX,

        y:
            (event.clientY -
             rect.top) *
            scaleY

    };

}


/* =====================================================
   TASTATUR
   ===================================================== */

function closeKeyboard() {

    if (
        document.activeElement
    ) {

        document
            .activeElement
            .blur();

    }

}


/* =====================================================
   EMPFÄNGER
   ===================================================== */

const otherPersonBox =
document.getElementById(
    "otherPersonBox"
);


const otherPersonName =
document.getElementById(
    "otherPersonName"
);


document
.querySelectorAll(
    'input[name="receiverType"]'
)
.forEach(
    function(radio) {

        radio.addEventListener(
            "change",
            function() {

                if (
                    this.value ===
                    "Andere anwesende Person"
                ) {

                    otherPersonBox
                        .classList
                        .remove("hidden");

                }

                else {

                    otherPersonBox
                        .classList
                        .add("hidden");

                    otherPersonName.value =
                        "";

                }

            }
        );

    }
);


/* =====================================================
   BARCODE SCANNEN
   ===================================================== */

barcode.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();


            const code =
                barcode.value.trim();


            if (code) {

                addPackage(
                    code
                );

            }


            barcode.value = "";


            closeKeyboard();

        }

    }
);


/* =====================================================
   PAKET HINZUFÜGEN
   ===================================================== */

function addPackage(
    scannedCode
) {

    let code =
        scannedCode;


    if (
        !code
    ) {

        code =
            barcode.value.trim();

    }


    if (!code) {

        barcode.focus();

        return;

    }


    /*
       Doppelte Paketnummer verhindern.
    */

    if (
        packages.includes(
            code
        )
    ) {

        alert(
            "Dieses Paket wurde bereits gescannt."
        );

        barcode.value = "";

        barcode.focus();

        return;

    }


    packages.push(
        code
    );


    renderPackages();


    barcode.value = "";


    /*
       Fokus wieder auf Barcode,
       damit der nächste Scan direkt
       erfolgen kann.
    */

    barcode.focus();

}


/* =====================================================
   PAKETE ANZEIGEN
   ===================================================== */

function renderPackages() {

    packageList.innerHTML = "";


    packages.forEach(
        function(code, index) {


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "package-item";


            const number =
                document.createElement(
                    "div"
                );


            number.className =
                "package-number";


            number.textContent =
                (index + 1) + ".";


            const codeDiv =
                document.createElement(
                    "div"
                );


            codeDiv.className =
                "package-code";


            codeDiv.textContent =
                code;


            const remove =
                document.createElement(
                    "button"
                );


            remove.type =
                "button";


            remove.className =
                "remove-package";


            remove.textContent =
                "🗑️";


            remove.onclick =
                function() {

                    removePackage(
                        index
                    );

                };


            row.appendChild(
                number
            );


            row.appendChild(
                codeDiv
            );


            row.appendChild(
                remove
            );


            packageList.appendChild(
                row
            );

        }
    );

}


/* =====================================================
   PAKET LÖSCHEN
   ===================================================== */

function removePackage(
    index
) {

    packages.splice(
        index,
        1
    );


    renderPackages();


    barcode.focus();

}


/* =====================================================
   UNTERSCHRIFT
   ===================================================== */

function startDrawing(event) {

    event.preventDefault();


    closeKeyboard();


    drawing = true;


    hasSignature = true;


    const position =
        getPosition(event);


    ctx.beginPath();


    ctx.moveTo(
        position.x,
        position.y
    );


    if (
        event.pointerId !== undefined
    ) {

        try {

            canvas.setPointerCapture(
                event.pointerId
            );

        }

        catch (_) {}

    }

}


function draw(event) {

    if (!drawing) {

        return;

    }


    event.preventDefault();


    const position =
        getPosition(event);


    ctx.lineTo(
        position.x,
        position.y
    );


    ctx.stroke();

}


function stopDrawing(event) {

    if (event) {

        event.preventDefault();

    }


    drawing = false;


    ctx.closePath();


    if (
        event &&
        event.pointerId !== undefined
    ) {

        try {

            canvas.releasePointerCapture(
                event.pointerId
            );

        }

        catch (_) {}

    }

}


canvas.addEventListener(
    "pointerdown",
    startDrawing,
    {
        passive: false
    }
);


canvas.addEventListener(
    "pointermove",
    draw,
    {
        passive: false
    }
);


canvas.addEventListener(
    "pointerup",
    stopDrawing,
    {
        passive: false
    }
);


canvas.addEventListener(
    "pointercancel",
    stopDrawing,
    {
        passive: false
    }
);


/* =====================================================
   UNTERSCHRIFT LÖSCHEN
   ===================================================== */

function clearSignature() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    hasSignature = false;

}


/* =====================================================
   EMPFÄNGERDATEN
   ===================================================== */

function getReceiverData() {

    const selected =
        document.querySelector(
            'input[name="receiverType"]:checked'
        );


    const type =
        selected.value;


    let name = "";


    if (
        type ===
        "Andere anwesende Person"
    ) {

        name =
            otherPersonName
                .value
                .trim();

    }


    return {

        type:
            type,

        name:
            name

    };

}


/* =====================================================
   HTML SICHER
   ===================================================== */

function escapeHtml(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/* =====================================================
   SPEICHERN
   ===================================================== */

function saveRecord() {

    const receiver =
        getReceiverData();


    if (
        receiver.type ===
        "Andere anwesende Person"
        &&
        !receiver.name
    ) {

        alert(
            "Bitte den Namen der anwesenden Person eingeben."
        );

        otherPersonName.focus();

        return;

    }


    if (
        packages.length === 0
    ) {

        alert(
            "Bitte mindestens ein Paket scannen."
        );

        barcode.focus();

        return;

    }


    if (!hasSignature) {

        alert(
            "Bitte den Empfang unterschreiben lassen."
        );

        return;

    }


    const record = {

        receiverType:
            receiver.type,

        receiverName:
            receiver.name,

        packages:
            [...packages],

        date:
            new Date()
            .toLocaleString(
                "de-DE"
            ),

        signature:
            canvas.toDataURL(
                "image/png"
            )

    };


    const records =
        JSON.parse(
            localStorage.getItem(
                "zebraRecords"
            )
            ||
            "[]"
        );


    records.unshift(
        record
    );


    localStorage.setItem(
        "zebraRecords",
        JSON.stringify(
            records
        )
    );


    loadRecords();


    /*
       Neue Erfassung vorbereiten.
    */

    packages = [];


    renderPackages();


    barcode.value = "";


    otherPersonName.value = "";


    clearSignature();


    closeKeyboard();


    document
        .querySelector(
            'input[name="receiverType"][value="Empfänger"]'
        )
        .checked = true;


    otherPersonBox
        .classList
        .add("hidden");


    const success =
        document.getElementById(
            "success"
        );


    success.style.display =
        "block";


    setTimeout(
        function() {

            success.style.display =
                "none";

        },
        3000
    );

}


/* =====================================================
   GESPEICHERTE VORGÄNGE
   ===================================================== */

function loadRecords() {

    const records =
        JSON.parse(
            localStorage.getItem(
                "zebraRecords"
            )
            ||
            "[]"
        );


    const container =
        document.getElementById(
            "records"
        );


    if (
        records.length === 0
    ) {

        container.innerHTML =
            '<div class="empty">' +
            'Noch keine Vorgänge gespeichert.' +
            '</div>';

        return;

    }


    container.innerHTML = "";


    records.forEach(
        function(record) {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "record";


            let html =

                "<div><strong>Empfangen von:</strong> "

                +

                escapeHtml(
                    record.receiverType
                )

                +

                "</div>";


            if (
                record.receiverName
            ) {

                html +=

                    "<div><strong>Name:</strong> "

                    +

                    escapeHtml(
                        record.receiverName
                    )

                    +

                    "</div>";

            }


            html +=
                "<div><strong>Pakete:</strong></div>";


            record.packages
                .forEach(
                    function(code, index) {

                        html +=

                            "<div>" +

                            (index + 1) +

                            ". " +

                            escapeHtml(
                                code
                            ) +

                            "</div>";

                    }
                );


            html +=

                "<div><strong>Datum:</strong> "

                +

                escapeHtml(
                    record.date
                )

                +

                "</div>";


            html +=

                "<div><strong>Unterschrift:</strong></div>"

                +

                '<img class="signature-image" src="' +

                record.signature +

                '" alt="Unterschrift">';


            div.innerHTML =
                html;


            container.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   PDF
   ===================================================== */

function buildPDF() {

    if (
        !window.jspdf ||
        !window.jspdf.jsPDF
    ) {

        alert(
            "PDF-Bibliothek wird noch geladen. Bitte kurz warten."
        );

        return null;

    }


    const receiver =
        getReceiverData();


    if (
        receiver.type ===
        "Andere anwesende Person"
        &&
        !receiver.name
    ) {

        alert(
            "Bitte den Namen der anwesenden Person eingeben."
        );

        return null;

    }


    if (
        packages.length === 0
    ) {

        alert(
            "Bitte mindestens ein Paket scannen."
        );

        return null;

    }


    if (!hasSignature) {

        alert(
            "Bitte zuerst unterschreiben."
        );

        return null;

    }


    const jsPDF =
        window.jspdf.jsPDF;


    const pdf =
        new jsPDF();


    const margin = 18;

    let y = 22;


    pdf.setFontSize(
        20
    );


    pdf.text(
        "Kundenerfassung",
        margin,
        y
    );


    y += 14;


    pdf.setFontSize(
        11
    );


    pdf.setFont(
        "helvetica",
        "bold"
    );


    pdf.text(
        "Empfangen von:",
        margin,
        y
    );


    pdf.setFont(
        "helvetica",
        "normal"
    );


    pdf.text(
        receiver.type,
        margin + 45,
        y
    );


    y += 8;


    if (
        receiver.name
    ) {

        pdf.setFont(
            "helvetica",
            "bold"
        );


        pdf.text(
            "Name:",
            margin,
            y
        );


        pdf.setFont(
            "helvetica",
            "normal"
        );


        pdf.text(
            receiver.name,
            margin + 45,
            y
        );


        y += 8;

    }


    pdf.setFont(
        "helvetica",
        "bold"
    );


    pdf.text(
        "Pakete:",
        margin,
        y
    );


    y += 7;


    pdf.setFont(
        "helvetica",
        "normal"
    );


    packages.forEach(
        function(code, index) {

            const lines =
                pdf.splitTextToSize(
                    (
                        index + 1
                    ) +
                    ". " +
                    code,
                    150
                );


            pdf.text(
                lines,
                margin + 5,
                y
            );


            y +=
                Math.max(
                    6,
                    lines.length * 5
                );

        }
    );


    y += 6;


    pdf.setFont(
        "helvetica",
        "bold"
    );


    pdf.text(
        "Datum / Uhrzeit:",
        margin,
        y
    );


    pdf.setFont(
        "helvetica",
        "normal"
    );


    pdf.text(
        new Date()
        .toLocaleString(
            "de-DE"
        ),
        margin + 45,
        y
    );


    y += 15;


    pdf.setFont(
        "helvetica",
        "bold"
    );


    pdf.text(
        "Unterschrift:",
        margin,
        y
    );


    y += 5;


    const signature =
        canvas.toDataURL(
            "image/png"
        );


    const ratio =
        canvas.width /
        canvas.height;


    let width = 170;


    let height =
        width /
        ratio;


    if (
        height > 60
    ) {

        height = 60;


        width =
            height *
            ratio;

    }


    pdf.addImage(
        signature,
        "PNG",
        margin,
        y,
        width,
        height
    );


    const filename =
        "Kundenerfassung_" +

        new Date()
        .toISOString()
        .slice(
            0,
            10
        )

        +

        ".pdf";


    return {

        pdf:
            pdf,

        blob:
            pdf.output(
                "blob"
            ),

        filename:
            filename

    };

}


/* =====================================================
   PDF ERSTELLEN
   ===================================================== */

function createPDF() {

    const result =
        buildPDF();


    if (!result) {

        return;

    }


    result.pdf.save(
        result.filename
    );

}


/* =====================================================
   PDF PER E-MAIL
   ===================================================== */

async function sendPDFByEmail() {

    const result =
        buildPDF();


    if (!result) {

        return;

    }


    const file =
        new File(

            [
                result.blob
            ],

            result.filename,

            {
                type:
                    "application/pdf"
            }

        );


    if (
        navigator.share
        &&
        navigator.canShare
        &&
        navigator.canShare({
            files: [file]
        })
    ) {

        try {

            await navigator.share({

                title:
                    "Kundenerfassung",

                text:
                    "Kundenerfassung als PDF",

                files:
                    [file]

            );


            return;

        }

        catch (error) {

            if (
                error &&
                error.name ===
                "AbortError"
            ) {

                return;

            }

        }

    }


    result.pdf.save(
        result.filename
    );


    alert(
        "Der Browser unterstützt das direkte Teilen des PDF-Anhangs nicht. Das PDF wurde gespeichert."
    );

}


/* =====================================================
   ALLE VORGÄNGE LÖSCHEN
   ===================================================== */

function deleteAllRecords() {

    const records =
        JSON.parse(
            localStorage.getItem(
                "zebraRecords"
            )
            ||
            "[]"
        );


    if (
        records.length === 0
    ) {

        alert(
            "Es sind keine Vorgänge gespeichert."
        );

        return;

    }


    if (
        confirm(
            "Wirklich alle Vorgänge löschen?"
        )
    ) {

        localStorage.removeItem(
            "zebraRecords"
        );


        loadRecords();

    }

}


/* =====================================================
   START
   ===================================================== */

loadRecords();
