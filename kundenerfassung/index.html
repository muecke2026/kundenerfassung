<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Kundenerfassung</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, sans-serif;
    background: #f2f4f7;
    color: #222;
}

body {
    padding-bottom: 30px;
}

header {
    background: #111827;
    color: white;
    text-align: center;
    padding: 20px 14px;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

header p {
    margin: 7px 0 0;
    font-size: 16px;
}

.container {
    width: 100%;
    max-width: 850px;
    margin: auto;
    padding: 14px;
}

.card {
    background: white;
    border-radius: 15px;
    padding: 18px;
    margin-bottom: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.step {
    color: #2563eb;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 12px;
}

label {
    display: block;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 9px;
}

.choice {
    display: flex;
    align-items: center;
    gap: 12px;
    border: 2px solid #d1d5db;
    border-radius: 12px;
    padding: 15px;
    margin: 10px 0;
    font-size: 19px;
}

.choice input {
    width: 24px;
    height: 24px;
    margin: 0;
}

input[type="text"] {
    width: 100%;
    padding: 16px;
    border: 2px solid #cbd5e1;
    border-radius: 12px;
    font-size: 20px;
    background: white;
}

input[type="text"]:focus {
    outline: none;
    border-color: #2563eb;
}

.hidden {
    display: none;
}

.help {
    margin-top: 9px;
    color: #666;
    font-size: 15px;
    line-height: 1.4;
}


/* ================================
   UNTERSCHRIFT
   ================================ */

#signatureCanvas {

    display: block;

    width: 100%;

    /*
       Gleiche Höhe in Hoch- und Querformat.
       Dadurch wird beim Drehen nichts gestreckt.
    */

    height: 280px;

    background: white;

    border: 3px solid #64748b;

    border-radius: 12px;

    touch-action: none;

    user-select: none;

    -webkit-user-select: none;

    -webkit-touch-callout: none;
}


/* ================================
   BUTTONS
   ================================ */

button {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 16px;
    margin-top: 10px;
    font-size: 19px;
    font-weight: bold;
}

.save {
    background: #16a34a;
    color: white;
}

.pdf {
    background: #2563eb;
    color: white;
}

.email {
    background: #7c3aed;
    color: white;
}

.clear {
    background: #6b7280;
    color: white;
}

.delete {
    background: #dc2626;
    color: white;
}

.success {
    display: none;
    background: #dcfce7;
    color: #166534;
    padding: 14px;
    border-radius: 12px;
    font-weight: bold;
    font-size: 18px;
    margin-bottom: 15px;
}

.record {
    border-top: 1px solid #ddd;
    padding: 16px 0;
}

.record:first-child {
    border-top: none;
}

.record div {
    font-size: 17px;
    margin: 6px 0;
}

.signature-image {
    width: 300px;
    max-width: 100%;
    border: 1px solid #ddd;
    border-radius: 8px;
}

.empty {
    color: #777;
    font-size: 16px;
}

</style>
</head>


<body>


<header>

<h1>📱 Kundenerfassung</h1>

<p>
Empfang · Barcode · Unterschrift
</p>

</header>


<div class="container">


<div
id="success"
class="success">

✓ Vorgang wurde gespeichert.

</div>


<!-- ================================
     EMPFÄNGER
     ================================ -->

<div class="card">

<div class="step">
SCHRITT 1
</div>

<label>
Wer hat die Sendung erhalten?
</label>


<label class="choice">

<input
type="radio"
name="receiverType"
value="Empfänger"
checked>

<span>
Der Empfänger
</span>

</label>


<label class="choice">

<input
type="radio"
name="receiverType"
value="Andere anwesende Person">

<span>
Eine andere anwesende Person
</span>

</label>


<div
id="otherPersonBox"
class="hidden">

<label
for="otherPersonName">

Name der anwesenden Person

</label>

<input
id="otherPersonName"
type="text"
placeholder="Name eingeben"
autocomplete="off">

</div>

</div>


<!-- ================================
     BARCODE
     ================================ -->

<div class="card">

<div class="step">
SCHRITT 2
</div>

<label for="barcode">
Barcode
</label>

<input
id="barcode"
type="text"
placeholder="Barcode scannen..."
autocomplete="off">

<div class="help">

Scan-Taste am Zebra T51 drücken.
Nach dem Scan wird die Tastatur geschlossen.

</div>

</div>


<!-- ================================
     UNTERSCHRIFT
     ================================ -->

<div class="card">

<div class="step">
SCHRITT 3
</div>

<label>
Unterschrift
</label>

<canvas id="signatureCanvas"></canvas>

<button
class="clear"
type="button"
onclick="clearSignature()">

Unterschrift löschen

</button>

</div>


<!-- ================================
     AKTIONEN
     ================================ -->

<div class="card">

<button
class="save"
type="button"
onclick="saveRecord()">

✓ Vorgang speichern

</button>


<button
class="pdf"
type="button"
onclick="createPDF()">

📄 PDF erstellen

</button>


<button
class="email"
type="button"
onclick="sendPDFByEmail()">

📧 PDF per E-Mail senden

</button>

</div>


<!-- ================================
     GESPEICHERTE VORGÄNGE
     ================================ -->

<div class="card">

<div class="step">
📋 Gespeicherte Vorgänge
</div>

<div id="records">

<div class="empty">
Noch keine Vorgänge gespeichert.
</div>

</div>

<button
class="delete"
type="button"
onclick="deleteAllRecords()">

Alle Vorgänge löschen

</button>

</div>


</div>


<script>

/* =====================================================
   ELEMENTE
   ===================================================== */

const canvas =
document.getElementById(
    "signatureCanvas"
);

const ctx =
canvas.getContext(
    "2d"
);

let drawing = false;

let hasSignature = false;


/* =====================================================
   CANVAS EINRICHTEN
   ===================================================== */

function setupCanvas() {

    const rect =
        canvas.getBoundingClientRect();


    /*
       Interne Canvas-Größe entspricht exakt
       der sichtbaren CSS-Größe.
    */

    canvas.width =
        Math.round(rect.width);

    canvas.height =
        Math.round(rect.height);


    ctx.setTransform(
        1,
        0,
        0,
        1,
        0,
        0
    );


    ctx.lineWidth = 3;

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

    ctx.strokeStyle = "#000";

}


/*
   Nach dem vollständigen Laden einrichten.
*/

window.addEventListener(
    "load",
    function() {

        setTimeout(
            setupCanvas,
            200
        );

    }
);


/* =====================================================
   ORIENTIERUNG
   ===================================================== */

/*
   WICHTIG:

   Wenn noch NICHT unterschrieben wurde,
   wird das Canvas nach einer Drehung neu
   dimensioniert.

   Eine vorhandene Unterschrift wird NICHT
   automatisch skaliert.
*/

let resizeTimer = null;


function orientationChanged() {

    clearTimeout(
        resizeTimer
    );


    resizeTimer =
        setTimeout(
            function() {

                if (!hasSignature) {

                    setupCanvas();

                }

            },
            300
        );

}


window.addEventListener(
    "resize",
    orientationChanged
);


window.addEventListener(
    "orientationchange",
    orientationChanged
);


/* =====================================================
   POSITION – 1:1
   ===================================================== */

function getPosition(event) {

    const rect =
        canvas.getBoundingClientRect();


    /*
       Skalierungsfaktor zwischen interner
       Canvas-Größe und sichtbarer Größe.

       Damit ist die Position auch dann
       exakt, wenn Android/Zebra die Canvas
       geringfügig anders darstellt.
    */

    const scaleX =
        canvas.width /
        rect.width;


    const scaleY =
        canvas.height /
        rect.height;


    return {

        x:
            (event.clientX -
             rect.left) *
            scaleX,

        y:
            (event.clientY -
             rect.top) *
            scaleY

    };

}


/* =====================================================
   TASTATUR SCHLIESSEN
   ===================================================== */

function closeKeyboard() {

    if (
        document.activeElement
    ) {

        document
            .activeElement
            .blur();

    }

}


/* =====================================================
   EMPFÄNGER
   ===================================================== */

const otherPersonBox =
document.getElementById(
    "otherPersonBox"
);

const otherPersonName =
document.getElementById(
    "otherPersonName"
);


document
.querySelectorAll(
    'input[name="receiverType"]'
)
.forEach(
    function(radio) {

        radio.addEventListener(
            "change",
            function() {

                if (
                    this.value ===
                    "Andere anwesende Person"
                ) {

                    otherPersonBox
                        .classList
                        .remove("hidden");

                }

                else {

                    otherPersonBox
                        .classList
                        .add("hidden");

                    otherPersonName.value =
                        "";

                }

            }
        );

    }
);


/* =====================================================
   BARCODE
   ===================================================== */

const barcode =
document.getElementById(
    "barcode"
);


barcode.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            closeKeyboard();

        }

    }
);


/* =====================================================
   UNTERSCHRIFT
   ===================================================== */

function startDrawing(event) {

    event.preventDefault();

    closeKeyboard();

    drawing = true;

    hasSignature = true;


    const position =
        getPosition(event);


    ctx.beginPath();


    ctx.moveTo(
        position.x,
        position.y
    );


    if (
        event.pointerId !== undefined
    ) {

        try {

            canvas.setPointerCapture(
                event.pointerId
            );

        }

        catch (_) {}

    }

}


function draw(event) {

    if (!drawing) {

        return;

    }


    event.preventDefault();


    const position =
        getPosition(event);


    ctx.lineTo(
        position.x,
        position.y
    );


    ctx.stroke();

}


function stopDrawing(event) {

    if (event) {

        event.preventDefault();

    }


    drawing = false;

    ctx.closePath();


    if (
        event &&
        event.pointerId !== undefined
    ) {

        try {

            canvas.releasePointerCapture(
                event.pointerId
            );

        }

        catch (_) {}

    }

}


/* =====================================================
   POINTER EVENTS
   ===================================================== */

canvas.addEventListener(
    "pointerdown",
    startDrawing,
    {
        passive: false
    }
);


canvas.addEventListener(
    "pointermove",
    draw,
    {
        passive: false
    }
);


canvas.addEventListener(
    "pointerup",
    stopDrawing,
    {
        passive: false
    }
);


canvas.addEventListener(
    "pointercancel",
    stopDrawing,
    {
        passive: false
    }
);


/* =====================================================
   UNTERSCHRIFT LÖSCHEN
   ===================================================== */

function clearSignature() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    hasSignature = false;

}


/* =====================================================
   EMPFÄNGERDATEN
   ===================================================== */

function getReceiverData() {

    const selected =
        document.querySelector(
            'input[name="receiverType"]:checked'
        );


    const type =
        selected.value;


    let name = "";


    if (
        type ===
        "Andere anwesende Person"
    ) {

        name =
            otherPersonName
                .value
                .trim();

    }


    return {

        type: type,

        name: name

    };

}


/* =====================================================
   HTML SICHER
   ===================================================== */

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/* =====================================================
   SPEICHERN
   ===================================================== */

function saveRecord() {

    const receiver =
        getReceiverData();


    const code =
        barcode.value.trim();


    if (
        receiver.type ===
        "Andere anwesende Person"
        &&
        !receiver.name
    ) {

        alert(
            "Bitte den Namen der anwesenden Person eingeben."
        );

        otherPersonName.focus();

        return;

    }


    if (!code) {

        alert(
            "Bitte zuerst den Barcode scannen."
        );

        barcode.focus();

        return;

    }


    if (!hasSignature) {

        alert(
            "Bitte zuerst unterschreiben."
        );

        return;

    }


    const record = {

        receiverType:
            receiver.type,

        receiverName:
            receiver.name,

        barcode:
            code,

        date:
            new Date()
            .toLocaleString(
                "de-DE"
            ),

        signature:
            canvas.toDataURL(
                "image/png"
            )

    };


    const records =
        JSON.parse(
            localStorage.getItem(
                "zebraRecords"
            )
            ||
            "[]"
        );


    records.unshift(
        record
    );


    localStorage.setItem(
        "zebraRecords",
        JSON.stringify(
            records
        )
    );


    loadRecords();


    barcode.value = "";

    otherPersonName.value = "";

    clearSignature();

    closeKeyboard();


    document
        .querySelector(
            'input[name="receiverType"][value="Empfänger"]'
        )
        .checked = true;


    otherPersonBox
        .classList
        .add("hidden");


    const success =
        document.getElementById(
            "success"
        );


    success.style.display =
        "block";


    setTimeout(
        function() {

            success.style.display =
                "none";

        },
        3000
    );

}


/* =====================================================
   VORGÄNGE LADEN
   ===================================================== */

function loadRecords() {

    const records =
        JSON.parse(
            localStorage.getItem(
                "zebraRecords"
            )
            ||
            "[]"
        );


    const container =
        document.getElementById(
            "records"
        );


    if (
        records.length === 0
    ) {

        container.innerHTML =
            '<div class="empty">' +
            'Noch keine Vorgänge gespeichert.' +
            '</div>';

        return;

    }


    container.innerHTML = "";


    records.forEach(
        function(record) {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "record";


            let html =

                "<div><strong>Empfangen von:</strong> "

                +

                escapeHtml(
                    record.receiverType
                )

                +

                "</div>";


            if (
                record.receiverName
            ) {

                html +=

                    "<div><strong>Name:</strong> "

                    +

                    escapeHtml(
                        record.receiverName
                    )

                    +

                    "</div>";

            }


            html +=

                "<div><strong>Barcode:</strong> "

                +

                escapeHtml(
                    record.barcode
                )

                +

                "</div>";


            html +=

                "<div><strong>Datum:</strong> "

                +

                escapeHtml(
                    record.date
                )

                +

                "</div>";


            html +=

                "<div><strong>Unterschrift:</strong></div>"

                +

                '<img class="signature-image" src="' +

                record.signature +

                '" alt="Unterschrift">';


            div.innerHTML =
                html;


            container.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   PDF
   ===================================================== */

function buildPDF() {

    if (
        !window.jspdf ||
        !window.jspdf.jsPDF
    ) {

        alert(
            "PDF-Bibliothek wird noch geladen. Bitte kurz warten."
        );

        return null;

    }


    const receiver =
        getReceiverData();


    const code =
        barcode.value.trim();


    if (
        receiver.type ===
        "Andere anwesende Person"
        &&
        !receiver.name
    ) {

        alert(
            "Bitte den Namen der anwesenden Person eingeben."
        );

        return null;

    }


    if (!code) {

        alert(
            "Bitte zuerst den Barcode scannen."
        );

        return null;

    }


    if (!hasSignature) {

        alert(
            "Bitte zuerst unterschreiben."
        );

        return null;

    }


    const jsPDF =
        window.jspdf.jsPDF;


    const pdf =
        new jsPDF();


    const margin = 18;

    let y = 22;


    pdf.setFontSize(20);

    pdf.text(
        "Kundenerfassung",
        margin,
        y
    );


    y += 14;


    pdf.setFontSize(11);


    const rows = [

        [
            "Empfangen von",
            receiver.type
        ]

    ];


    if (
        receiver.name
    ) {

        rows.push([
            "Name",
            receiver.name
        ]);

    }


    rows.push(

        [
            "Barcode",
            code
        ],

        [
            "Datum / Uhrzeit",
            new Date()
            .toLocaleString(
                "de-DE"
            )
        ]

    );


    rows.forEach(
        function(row) {

            pdf.setFont(
                "helvetica",
                "bold"
            );

            pdf.text(
                row[0] + ":",
                margin,
                y
            );

            pdf.setFont(
                "helvetica",
                "normal"
            );

            pdf.text(
                row[1],
                margin + 45,
                y
            );

            y += 8;

        }
    );


    y += 10;


    pdf.setFont(
        "helvetica",
        "bold"
    );


    pdf.text(
        "Unterschrift:",
        margin,
        y
    );


    y += 5;


    const signature =
        canvas.toDataURL(
            "image/png"
        );


    const ratio =
        canvas.width /
        canvas.height;


    let width = 170;

    let height =
        width /
        ratio;


    if (
        height > 60
    ) {

        height = 60;

        width =
            height *
            ratio;

    }


    pdf.addImage(
        signature,
        "PNG",
        margin,
        y,
        width,
        height
    );


    const filename =
        "Kundenerfassung_" +
        new Date()
        .toISOString()
        .slice(0,10)
        +
        ".pdf";


    return {

        pdf: pdf,

        blob:
            pdf.output("blob"),

        filename:
            filename

    };

}


/* =====================================================
   PDF ERSTELLEN
   ===================================================== */

function createPDF() {

    const result =
        buildPDF();


    if (!result) {

        return;

    }


    result.pdf.save(
        result.filename
    );

}


/* =====================================================
   PDF PER E-MAIL
   ===================================================== */

async function sendPDFByEmail() {

    const result =
        buildPDF();


    if (!result) {

        return;

    }


    const file =
        new File(
            [result.blob],
            result.filename,
            {
                type:
                    "application/pdf"
            }
        );


    /*
       Das echte PDF wird an die
       Android-Teilen-Funktion übergeben.
    */

    if (
        navigator.share &&
        navigator.canShare &&
        navigator.canShare({
            files: [file]
        })
    ) {

        try {

            await navigator.share({

                title:
                    "Kundenerfassung",

                text:
                    "Kundenerfassung als PDF",

                files:
                    [file]

            });

            return;

        }

        catch (error) {

            if (
                error.name ===
                "AbortError"
            ) {

                return;

            }

        }

    }


    /*
       Falls der Browser keine
       Dateifreigabe unterstützt:
       PDF speichern.
    */

    result.pdf.save(
        result.filename
    );


    alert(
        "Der Browser unterstützt das direkte Teilen des PDF-Anhangs nicht. Das PDF wurde gespeichert."
    );

}


/* =====================================================
   ALLE VORGÄNGE LÖSCHEN
   ===================================================== */

function deleteAllRecords() {

    const records =
        JSON.parse(
            localStorage.getItem(
                "zebraRecords"
            )
            ||
            "[]"
        );


    if (
        records.length === 0
    ) {

        alert(
            "Es sind keine Vorgänge gespeichert."
        );

        return;

    }


    if (
        confirm(
            "Wirklich alle Vorgänge löschen?"
        )
    ) {

        localStorage.removeItem(
            "zebraRecords"
        );

        loadRecords();

    }

}


/* =====================================================
   START
   ===================================================== */

loadRecords();

</script>

</body>
</html>
