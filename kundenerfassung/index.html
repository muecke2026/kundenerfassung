<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Kundenerfassung</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  color: #222;
}

body {
  min-height: 100vh;
}

header {
  background: #111827;
  color: white;
  text-align: center;
  padding: 22px 14px;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin: 7px 0 0;
  font-size: 17px;
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 14px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.step {
  color: #2563eb;
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 10px;
}

label {
  display: block;
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 10px;
}

input[type="text"] {
  width: 100%;
  padding: 17px;
  border: 2px solid #cbd5e1;
  border-radius: 12px;
  font-size: 21px;
  background: white;
  color: #222;
}

input[type="text"]:focus {
  outline: none;
  border-color: #2563eb;
}

.help {
  margin-top: 10px;
  color: #666;
  font-size: 16px;
  line-height: 1.4;
}


/* ==========================================
   UNTERSCHRIFT
   ========================================== */

.signature-wrapper {
  width: 100%;
  position: relative;
}

#signatureCanvas {

  display: block;

  width: 100%;

  height: 280px;

  background: white;

  border: 3px solid #9ca3af;

  border-radius: 12px;

  /*
    Sehr wichtig für Android / Zebra:
    Der Browser darf die Berührung nicht
    als Scrollen oder Zoom interpretieren.
  */

  touch-action: none;

  /*
    Keine Textauswahl.
  */

  user-select: none;
  -webkit-user-select: none;

  /*
    Kein Fokus.
  */

  outline: none;

  /*
    Verhindert lange Touch-Menüs.
  */

  -webkit-touch-callout: none;
}


/* ==========================================
   BUTTONS
   ========================================== */

button {

  width: 100%;

  border: none;

  border-radius: 12px;

  padding: 17px;

  margin-top: 11px;

  font-size: 20px;

  font-weight: bold;

  cursor: pointer;
}

.save {
  background: #16a34a;
  color: white;
}

.clear {
  background: #6b7280;
  color: white;
}

.delete {
  background: #dc2626;
  color: white;
}


/* ==========================================
   ERFOLG
   ========================================== */

.success {

  display: none;

  background: #dcfce7;

  color: #166534;

  padding: 15px;

  border-radius: 12px;

  font-weight: bold;

  font-size: 18px;

  margin-bottom: 15px;
}


/* ==========================================
   GESPEICHERTE VORGÄNGE
   ========================================== */

.record {

  border-top: 1px solid #ddd;

  padding: 17px 0;
}

.record:first-child {
  border-top: none;
}

.record div {

  font-size: 17px;

  margin: 6px 0;
}

.signature-image {

  width: 300px;

  max-width: 100%;

  border: 1px solid #ddd;

  border-radius: 8px;
}

.empty {

  color: #777;

  font-size: 16px;
}

</style>

</head>


<body>


<header>

  <h1>📱 Kundenerfassung</h1>

  <p>
    Name · Barcode · Unterschrift
  </p>

</header>


<div class="container">


  <!-- ======================================
       ERFOLG
       ====================================== -->

  <div
    id="success"
    class="success">

    ✓ Vorgang wurde gespeichert.

  </div>


  <!-- ======================================
       SCHRITT 1
       ====================================== -->

  <div class="card">

    <div class="step">
      SCHRITT 1
    </div>

    <label for="customerName">
      Name des Kunden
    </label>

    <input
      id="customerName"
      type="text"
      placeholder="Name eingeben"
      autocomplete="off">

  </div>


  <!-- ======================================
       SCHRITT 2
       ====================================== -->

  <div class="card">

    <div class="step">
      SCHRITT 2
    </div>

    <label for="barcode">
      Barcode
    </label>

    <input
      id="barcode"
      type="text"
      placeholder="Barcode scannen..."
      autocomplete="off">

    <div class="help">

      Scan-Taste am Zebra T51 drücken.

      Nach dem Scan wird die Tastatur
      automatisch geschlossen.

    </div>

  </div>


  <!-- ======================================
       SCHRITT 3
       ====================================== -->

  <div class="card">

    <div class="step">
      SCHRITT 3
    </div>

    <label>
      Unterschrift des Kunden
    </label>

    <div class="signature-wrapper">

      <canvas
        id="signatureCanvas">
      </canvas>

    </div>


    <button
      type="button"
      class="clear"
      onclick="clearSignature()">

      Unterschrift löschen

    </button>

  </div>


  <!-- ======================================
       SPEICHERN
       ====================================== -->

  <div class="card">

    <button
      type="button"
      class="save"
      onclick="saveRecord()">

      ✓ Vorgang speichern

    </button>

  </div>


  <!-- ======================================
       GESPEICHERTE VORGÄNGE
       ====================================== -->

  <div class="card">

    <div class="step">

      📋 Gespeicherte Vorgänge

    </div>


    <div id="records">

      <div class="empty">

        Noch keine Vorgänge gespeichert.

      </div>

    </div>


    <button
      type="button"
      class="delete"
      onclick="deleteAllRecords()">

      Alle Vorgänge löschen

    </button>

  </div>


</div>


<script>


/* ======================================================
   ELEMENTE
   ====================================================== */

const nameInput =
  document.getElementById(
    "customerName"
  );


const barcodeInput =
  document.getElementById(
    "barcode"
  );


const canvas =
  document.getElementById(
    "signatureCanvas"
  );


const ctx =
  canvas.getContext(
    "2d"
  );


let drawing = false;

let hasSignature = false;


/* ======================================================
   TASTATUR SCHLIESSEN
   ====================================================== */

function closeKeyboard() {

  nameInput.blur();

  barcodeInput.blur();

}


/* ======================================================
   BARCODE SCANNER
   ====================================================== */

barcodeInput.addEventListener(

  "keydown",

  function(event) {

    if (
      event.key === "Enter" ||
      event.keyCode === 13
    ) {

      event.preventDefault();

      closeKeyboard();

    }

  }

);


/* ======================================================
   CANVAS PIXELGENAU EINRICHTEN
   ====================================================== */

function setupCanvas() {

  const rect =
    canvas.getBoundingClientRect();


  /*
    devicePixelRatio sorgt dafür,
    dass die tatsächliche interne
    Canvas-Auflösung zur Display-
    Auflösung passt.
  */

  const ratio =
    window.devicePixelRatio || 1;


  canvas.width =
    Math.round(
      rect.width * ratio
    );


  canvas.height =
    Math.round(
      rect.height * ratio
    );


  /*
    Wir skalieren den Zeichenkontext
    wieder auf CSS-Pixel.

    Dadurch stimmen Touch-Koordinaten
    und sichtbare Koordinaten exakt überein.
  */

  ctx.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );


  ctx.lineWidth = 3;

  ctx.lineCap =
    "round";

  ctx.lineJoin =
    "round";

  ctx.strokeStyle =
    "#000";

}


setupCanvas();


/* ======================================================
   BEI ORIENTIERUNGSÄNDERUNG
   ====================================================== */

window.addEventListener(
  "resize",
  function() {

    /*
      Normalerweise bleibt der T51
      im gleichen Format.

      Wir richten das Canvas trotzdem
      neu ein.
    */

    setupCanvas();

  }
);


/* ======================================================
   TOUCH-POSITION PIXELGENAU BERECHNEN
   ====================================================== */

function getTouchPosition(
  event
) {

  const rect =
    canvas.getBoundingClientRect();


  const touch =
    event.touches &&
    event.touches.length
      ? event.touches[0]
      : event;


  return {

    x:
      touch.clientX -
      rect.left,

    y:
      touch.clientY -
      rect.top

  };

}


/* ======================================================
   UNTERSCHRIFT START
   ====================================================== */

function startSignature(
  event
) {

  /*
    Sehr wichtig:
    Browser darf die Touch-Geste
    nicht selbst verarbeiten.
  */

  event.preventDefault();


  /*
    Tastatur schließen,
    falls sie noch offen ist.
  */

  closeKeyboard();


  drawing = true;

  hasSignature = true;


  const position =
    getTouchPosition(
      event
    );


  ctx.beginPath();


  ctx.moveTo(
    position.x,
    position.y
  );

}


/* ======================================================
   UNTERSCHRIFT ZEICHNEN
   ====================================================== */

function drawSignature(
  event
) {

  if (!drawing) {

    return;

  }


  event.preventDefault();


  const position =
    getTouchPosition(
      event
    );


  ctx.lineTo(
    position.x,
    position.y
  );


  ctx.stroke();

}


/* ======================================================
   UNTERSCHRIFT ENDE
   ====================================================== */

function endSignature(
  event
) {

  if (event) {

    event.preventDefault();

  }


  drawing = false;


  ctx.closePath();

}


/* ======================================================
   TOUCH EVENTS
   ====================================================== */

canvas.addEventListener(

  "touchstart",

  startSignature,

  {
    passive: false
  }

);


canvas.addEventListener(

  "touchmove",

  drawSignature,

  {
    passive: false
  }

);


canvas.addEventListener(

  "touchend",

  endSignature,

  {
    passive: false
  }

);


canvas.addEventListener(

  "touchcancel",

  endSignature,

  {
    passive: false
  }

);


/* ======================================================
   MAUS / FALLBACK
   ====================================================== */

canvas.addEventListener(

  "mousedown",

  startSignature

);


canvas.addEventListener(

  "mousemove",

  drawSignature

);


canvas.addEventListener(

  "mouseup",

  endSignature

);


canvas.addEventListener(

  "mouseleave",

  endSignature

);


/* ======================================================
   UNTERSCHRIFT LÖSCHEN
   ====================================================== */

function clearSignature() {

  const rect =
    canvas.getBoundingClientRect();


  const ratio =
    window.devicePixelRatio || 1;


  ctx.clearRect(

    0,

    0,

    rect.width,

    rect.height

  );


  hasSignature =
    false;

}


/* ======================================================
   VORGANG SPEICHERN
   ====================================================== */

function saveRecord() {


  const name =
    nameInput.value.trim();


  const barcode =
    barcodeInput.value.trim();


  if (!name) {

    alert(
      "Bitte zuerst den Namen des Kunden eingeben."
    );

    nameInput.focus();

    return;

  }


  if (!barcode) {

    alert(
      "Bitte zuerst den Barcode scannen."
    );

    barcodeInput.focus();

    return;

  }


  if (!hasSignature) {

    alert(
      "Bitte den Kunden unterschreiben lassen."
    );

    return;

  }


  const record = {

    name:
      name,

    barcode:
      barcode,

    date:
      new Date().toLocaleString(
        "de-DE"
      ),

    signature:
      canvas.toDataURL(
        "image/png"
      )

  };


  let records =

    JSON.parse(

      localStorage.getItem(
        "zebraRecords"
      )

      || "[]"

    );


  records.unshift(
    record
  );


  localStorage.setItem(

    "zebraRecords",

    JSON.stringify(
      records
    )

  );


  loadRecords();


  nameInput.value =
    "";

  barcodeInput.value =
    "";


  clearSignature();


  closeKeyboard();


  const success =
    document.getElementById(
      "success"
    );


  success.style.display =
    "block";


  setTimeout(

    function() {

      success.style.display =
        "none";

    },

    3000

  );

}


/* ======================================================
   GESPEICHERTE VORGÄNGE LADEN
   ====================================================== */

function loadRecords() {


  const records =

    JSON.parse(

      localStorage.getItem(
        "zebraRecords"
      )

      || "[]"

    );


  const container =

    document.getElementById(
      "records"
    );


  if (
    records.length === 0
  ) {

    container.innerHTML =

      '<div class="empty">' +

      'Noch keine Vorgänge gespeichert.' +

      '</div>';

    return;

  }


  container.innerHTML =
    "";


  records.forEach(

    function(record) {


      const div =

        document.createElement(
          "div"
        );


      div.className =
        "record";


      div.innerHTML =


        "<div><strong>Name:</strong> " +

        escapeHtml(
          record.name
        ) +

        "</div>" +


        "<div><strong>Barcode:</strong> " +

        escapeHtml(
          record.barcode
        ) +

        "</div>" +


        "<div><strong>Datum:</strong> " +

        escapeHtml(
          record.date
        ) +

        "</div>" +


        "<div><strong>Unterschrift:</strong></div>" +


        '<img class="signature-image" ' +

        'src="' +

        record.signature +

        '" ' +

        'alt="Unterschrift">';


      container.appendChild(
        div
      );

    }

  );

}


/* ======================================================
   TEXT SICHER DARSTELLEN
   ====================================================== */

function escapeHtml(
  text
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text;


  return div.innerHTML;

}


/* ======================================================
   ALLE VORGÄNGE LÖSCHEN
   ====================================================== */

function deleteAllRecords() {


  const records =

    JSON.parse(

      localStorage.getItem(
        "zebraRecords"
      )

      || "[]"

    );


  if (
    records.length === 0
  ) {

    alert(
      "Es sind keine Vorgänge gespeichert."
    );

    return;

  }


  if (

    confirm(
      "Wirklich alle Vorgänge löschen?"
    )

  ) {


    localStorage.removeItem(
      "zebraRecords"
    );


    loadRecords();

  }

}


/* ======================================================
   START
   ====================================================== */

loadRecords();


</script>


</body>
</html>
